<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel MM · Bel-Ray — Anglo American Los Bronces</title>
<style>
  :root{
    --bg:#0B1220; --panel:#131C2E; --panel2:#1A2438; --line:#243049;
    --text:#E8EDF6; --muted:#8A97AD; --dim:#5E6B82;
    --verde:#3FB950; --verdeBg:#132819;
    --ambar:#E3A008; --ambarBg:#2A2109;
    --rojo:#F0616D; --rojoBg:#2A1216;
    --azul:#3B82F6; --azulBg:#0E1D33;
    --acento:#4FD1C5;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    padding:20px; min-height:100vh;
  }
  .top{
    display:flex; justify-content:space-between; align-items:center;
    border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:18px;
  }
  .brand{display:flex; align-items:baseline; gap:12px}
  .brand h1{font-size:20px; font-weight:600; letter-spacing:0.5px}
  .brand .sub{font-size:12px; color:var(--muted)}
  .status{display:flex; align-items:center; gap:18px; font-size:12px; color:var(--muted)}
  .live{display:flex; align-items:center; gap:6px}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--verde); animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
  .clock{font-variant-numeric:tabular-nums; font-size:14px; color:var(--text)}

  .kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px}
  .kpi{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px}
  .kpi .label{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.4px}
  .kpi .value{font-size:24px; font-weight:700; margin-top:2px; font-variant-numeric:tabular-nums}
  .kpi .value small{font-size:13px; color:var(--muted); font-weight:400}

  .section-title{font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin:6px 0 12px}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:9px 11px; position:relative; overflow:hidden;
  }
  .card.crit{border-left:3px solid var(--rojo)}
  .card.warn{border-left:3px solid var(--ambar)}
  .card.ok{border-left:3px solid var(--verde)}
  .card-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:2px; gap:6px}
  .equipo{font-size:12.5px; font-weight:600; line-height:1.2}
  .otras-title{font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--dim); margin:26px 0 4px}
  .otras-sub{font-size:11px; color:var(--dim); margin-bottom:10px}
  .otras-tabla{width:100%; border-collapse:collapse; font-size:12px; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden}
  .otras-tabla th{text-align:left; font-weight:600; color:var(--dim); font-size:10px; letter-spacing:1px; text-transform:uppercase; padding:8px 10px; border-bottom:1px solid var(--line)}
  .otras-tabla td{padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; line-height:1.35}
  .otras-tabla tr:last-child td{border-bottom:none}
  .otras-tabla .mono{font-family:ui-monospace,monospace; font-size:11px; color:var(--dim); white-space:nowrap}
  .tags{display:flex; flex-wrap:wrap; gap:4px; margin-top:4px}
  .tag{font-size:9px; font-weight:700; letter-spacing:.5px; padding:1px 6px; border-radius:4px; white-space:nowrap; line-height:1.4}
  .tag.br{border:1.5px solid var(--text); color:var(--text)}
  .tag.aa{border:1.5px dashed var(--dim); color:var(--dim)}
  .tag.g{background:var(--text); color:var(--bg); border:1.5px solid var(--text)}
  .tag.p{border:1px dotted var(--dim); color:var(--dim)}
  .tag.obs{border:1px solid #E3B341; color:#E3B341}
  .ot{font-size:9.5px; color:var(--dim); font-family:ui-monospace,monospace; margin-top:1px}
  .pill{font-size:9px; font-weight:700; padding:2px 7px; border-radius:14px; white-space:nowrap; flex-shrink:0}
  .pill.crit{background:var(--rojoBg); color:var(--rojo)}
  .pill.warn{background:var(--ambarBg); color:var(--ambar)}
  .pill.ok{background:var(--verdeBg); color:var(--verde)}
  .actividad{font-size:10.5px; color:var(--muted); margin:3px 0 6px; line-height:1.3}

  .prog-wrap{margin-bottom:4px}
  .prog-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:3px}
  .prog-pct{font-size:16px; font-weight:700; font-variant-numeric:tabular-nums}
  .prog-hrs{font-size:9.5px; color:var(--dim)}
  .bar{height:6px; background:var(--panel2); border-radius:4px; overflow:hidden}
  .bar-fill{height:100%; border-radius:4px; transition:width 0.6s ease}
  .fill-ok{background:var(--verde)} .fill-warn{background:var(--ambar)} .fill-crit{background:var(--rojo)}

  .terreno{display:flex; align-items:center; flex-wrap:wrap; gap:4px; padding-top:5px; margin-top:4px; border-top:1px solid var(--line); font-size:9.5px}
  .terreno .icon{color:var(--acento); font-size:8px}
  .persona{background:var(--azulBg); color:#7FB2F5; padding:1px 6px; border-radius:10px; font-size:9.5px; font-weight:500}
  .en-terreno-tag{
    position:absolute; top:14px; right:14px; display:none;
  }

  .empty{color:var(--dim); text-align:center; padding:40px; font-size:14px}
  .footer{margin-top:24px; text-align:center; font-size:11px; color:var(--dim)}
  @media(max-width:640px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    .grid{grid-template-columns:1fr}
  }
  .btn-nav{color:var(--muted,#8A97AD); text-decoration:none; font-size:13px; background:var(--panel,#131C2E); border:1px solid var(--line,#243049); border-radius:20px; padding:6px 14px; margin-right:14px}
  .btn-nav:hover{color:#E8EDF6; border-color:#8A97AD}
  .kpi-grupo{margin-bottom:18px}
  .kpi-titulo{display:flex; align-items:baseline; gap:10px; margin-bottom:8px; flex-wrap:wrap}
  .kpi-tag{font-size:11px; font-weight:700; letter-spacing:.6px; padding:3px 10px; border-radius:6px; border:2px solid #E8EDF6; color:#E8EDF6}
  .kpi-tag.punt{border:1.5px dashed #8A97AD; color:#C9D3E3}
  .kpi-nota{font-size:12px; color:#8A97AD}
  .kpi-tag.azul{border-color:#3B82F6; background:#3B82F6; color:#fff}
  .kpi-fila{font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--dim); margin:8px 0 5px}
  .kpi-grupo .kpis{margin-bottom:6px}
  .kpis.k4{grid-template-columns:repeat(4,1fr)}
  .kpis.k5{grid-template-columns:repeat(5,1fr)}
  .v-ok{color:var(--verde)} .v-warn{color:var(--ambar)} .v-crit{color:var(--rojo)}
  .bloque-br{background:var(--azulBg); border:1.5px solid var(--azul); border-radius:12px; padding:14px; margin-bottom:22px}
  .bloque-br .kpi-titulo{margin-bottom:10px}
  @media(max-width:640px){ .kpis.k4,.kpis.k5{grid-template-columns:repeat(2,1fr)} }
</style>

<script>
// ============================================================
//  CONFIGURACIÓN — pega las URLs de tus dos hojas publicadas
// ============================================================
//  Necesitas publicar DOS pestañas como CSV:
//  Archivo > Compartir > Publicar en la web
//    1) pestaña CAPTURA      > CSV  → pégala en SHEET_CSV_URL
//    2) pestaña REGISTRO_NFC > CSV  → pégala en NFC_CSV_URL
//  Si las dejas vacías, el panel usa datos de ejemplo.
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRuKIv4RpPLmGUOHTrClUnWR1MpW7RLIVczjE4MfweIp-KeuwoaPtnfQVpL2ohNXqitH4b93zFO9xPV/pub?gid=1096962834&single=true&output=csv";   // CAPTURA (tareas)
const NFC_CSV_URL   = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRuKIv4RpPLmGUOHTrClUnWR1MpW7RLIVczjE4MfweIp-KeuwoaPtnfQVpL2ohNXqitH4b93zFO9xPV/pub?gid=109866302&single=true&output=csv";   // REGISTRO_NFC (personas en terreno)
const REFRESH_MS = 30000; // 30 segundos

// Datos de ejemplo (tu data real del 11-07) mientras conectas el Sheet
const DATOS_EJEMPLO = [
  {equipo:"Molino SAG", ot:"4013457119", actividad:"Cambio sellos perimetrales MLS001 inferiores", avance:25, hrs:8, criticidad:"Alta", enTerreno:["D. Herrera","J. Molina"]},
  {equipo:"Molino de Bolas N°2", ot:"4012442142", actividad:"Bombas y sistema de lubricación (17 sub-tareas)", avance:12, hrs:17, criticidad:"Alta", enTerreno:["F. Manqueche"]},
  {equipo:"Molino SAG", ot:"4012441947", actividad:"Sello molino SAG cambio y lubricación alimentación", avance:0, hrs:4, criticidad:"Alta", enTerreno:[]},
  {equipo:"Molino de Bolas N°1", ot:"4013457118", actividad:"Cambio sellos perimetrales MLB001", avance:100, hrs:30, criticidad:"Alta", enTerreno:[]},
  {equipo:"Planta de Cal", ot:"4015377192", actividad:"Cambio de sellos y aceite", avance:0, hrs:6, criticidad:"Alta", enTerreno:[], bloqueado:"Sin MAF ni repuestos"},
];

function parseNum(raw){
  let s = String(raw||"").trim().replace(",",".");
  let v = parseFloat(s);
  return isNaN(v) ? 0 : v;
}

function parseAvance(raw){
  let s = String(raw||"").trim().replace("%","").replace(",",".");
  let v = parseFloat(s);
  if(isNaN(v)) return 0;
  return Math.round(v);
}

function nivel(av, bloqueado){
  if(bloqueado) return "warn";
  if(av >= 100) return "ok";
  if(av < 50) return "crit";
  return "warn";
}
function pillText(av, bloqueado){
  if(bloqueado) return "BLOQUEADO";
  if(av >= 100) return "COMPLETADA";
  if(av === 0) return "SIN INICIAR";
  return "EN PROCESO";
}

function agruparPorOT(datos){
  const mapa = {};
  datos.forEach(d=>{
    const kOT = d.ot;   // una sola tarjeta por OT (aunque tenga actividades de distintos grupos)
    if(!mapa[kOT]){
      mapa[kOT] = {
        ot:d.ot, equipo:d.equipo, equipos:[], hrsTotal:0, hrsGanadas:0, horasReal:0,
        actividades:0, completadas:0, enProceso:0, sinIniciar:0, sumAv:0, gantt:false,
        bloqueado:"", enTerreno:[], respons:d.respons||"", grupos:[], alerta:false
      };
    }
    const g = mapa[kOT];
    if(d.equipo && !g.equipos.includes(d.equipo)) g.equipos.push(d.equipo);
    g.hrsTotal += d.hrs;
    g.hrsGanadas += d.hrs * d.avance / 100;
    g.horasReal += d.horasReal||0;
    g.sumAv += d.avance; if(d.gantt) g.gantt = true;
    g.actividades++;
    if(d.avance>=100) g.completadas++;
    else if(d.avance>0) g.enProceso++;
    else g.sinIniciar++;
    if(d.bloqueado && !g.bloqueado) g.bloqueado = d.bloqueado;
    if(d.alerta) g.alerta = true;
    { const gg = grupoDe(d.respons); if(!g.grupos.includes(gg)) g.grupos.push(gg); }
    if(d.enTerreno && d.enTerreno.length) g.enTerreno = g.enTerreno.concat(d.enTerreno);
  });
  return Object.values(mapa).map(g=>({
    ot:g.ot, equipo:g.equipos.join(" · ") || g.equipo,
    // con horas: ponderado por horas; sin horas (actividades fuera de la Gantt): promedio simple
    avance: g.hrsTotal>0 ? Math.round(g.hrsGanadas/g.hrsTotal*100) : (g.actividades ? Math.round(g.sumAv/g.actividades) : 0),
    hrs: Math.round(g.hrsTotal*10)/10,
    horasReal: Math.round(g.horasReal*10)/10,
    actividades:g.actividades, completadas:g.completadas,
    enProceso:g.enProceso, sinIniciar:g.sinIniciar,
    bloqueado:g.bloqueado, enTerreno:[...new Set(g.enTerreno)],
    respons:g.respons, grupos:g.grupos, alerta:g.alerta, gantt:g.gantt
  }));
}

const grupoDe = r => /apoyo/i.test(r||"") ? "apoyo" : (/otra/i.test(r||"") ? "otras" : (/anglo|tercero/i.test(r||"") ? "anglo" : "belray"));
const ETQ = {belray:"BEL-RAY", apoyo:"APOYO AA", anglo:"ANGLO + TERCEROS", otras:"OTRAS"};
const esApoyo = r => grupoDe(r)!=="belray";
let filtro = "todas", ultimosDatos = [];
function setFiltro(f){ filtro=f; render(ultimosDatos); }
window.setFiltro = setFiltro;

// Los electroimanes de las correas CT-4 y CT-3.1 cuentan como UNA sola actividad junto con su correa
const ELECTRO_JUNTO = ["4","3.1"];
const codCT = e => { const m=/ct-?\s*(\d+(?:\.\d+)?)/i.exec(e||""); return m?m[1]:""; };
function fusionarElectroimanes(rows){
  const copia = rows.map(r=>Object.assign({},r));
  const esEl = r => /electro\s*-?\s*im[aá]n/i.test(r.equipo) && ELECTRO_JUNTO.includes(codCT(r.equipo));
  const res = copia.filter(r=>!esEl(r));
  copia.filter(esEl).forEach(e=>{
    const c = res.find(r=>r.ot===e.ot && /^correa/i.test(r.equipo) && codCT(r.equipo)===codCT(e.equipo));
    if(!c){ res.push(e); return; }
    if(!c._n){ c._n = 1; c._sum = c.avance; c.equipo += " + Electroimán"; }
    c._n++; c._sum += e.avance;
    c.avance = Math.floor(c._sum/c._n);          // llega a 100% solo cuando ambos están al 100%
    c.hrs += e.hrs; c.horasReal = (c.horasReal||0) + (e.horasReal||0);
    if(e.actividad && e.actividad!==c.actividad) c.actividad += " + " + e.actividad;
    if(e.enTerreno && e.enTerreno.length) c.enTerreno = (c.enTerreno||[]).concat(e.enTerreno);
    if(e.bloqueado && !c.bloqueado) c.bloqueado = e.bloqueado;
    if(e.alerta) c.alerta = true;
  });
  return res;
}

// Indicadores de un grupo: actividades y OT (completadas / en proceso / pendientes) + horas de ESAS actividades
function indicadores(rows){
  // pausada = actividad con "Pausado por" y sin terminar; no se cuenta como en proceso ni pendiente
  const pausa = r => !!r.bloqueado && r.avance<100;
  const clase = r => r.avance>=100 ? "c" : (pausa(r) ? "z" : (r.avance>0 ? "p" : "n"));
  const acts = {t:rows.length, c:0, p:0, n:0, z:0};
  rows.forEach(r=>acts[clase(r)]++);
  const porOT = {};
  rows.forEach(r=>{ (porOT[r.ot] = porOT[r.ot]||[]).push(r); });
  const ots = {t:0, c:0, p:0, n:0, z:0};
  Object.values(porOT).forEach(rs=>{
    ots.t++;
    ots[ rs.every(r=>r.avance>=100) ? "c" : (rs.some(pausa) ? "z" : (rs.some(r=>r.avance>0) ? "p" : "n")) ]++;
  });
  const hrs = rows.reduce((s,r)=>s+r.hrs,0);
  const ganadas = rows.reduce((s,r)=>s+r.hrs*r.avance/100,0);
  return {
    acts, ots, hrs, real: rows.reduce((s,r)=>s+(r.horasReal||0),0),
    // ponderado por horas; si no hay horas, promedio simple
    avance: hrs>0 ? Math.round(ganadas/hrs*100) : (rows.length ? Math.round(rows.reduce((s,r)=>s+r.avance,0)/rows.length) : 0)
  };
}

function ordenarOT(ots){
  // bloqueadas primero, luego por avance ascendente
  return ots.sort((a,b)=>{
    const pa = a.bloqueado?0:1, pb = b.bloqueado?0:1;
    if(pa!==pb) return pa-pb;
    return a.avance - b.avance;
  });
}

function cardsHtml(ots, haySplit){
  return ots.map(o=>{
    const nv = nivel(o.avance, o.bloqueado);
    const gente = (o.enTerreno && o.enTerreno.length)
      ? o.enTerreno.map(p=>`<span class="persona">${p}</span>`).join(" ")
      : '';
    const detalle = o.bloqueado ? `⚠ ${o.bloqueado}` : `${o.actividades} act. · ${o.completadas} OK`;
    return `
      <div class="card ${nv}">
        <div class="card-head">
          <div>
            <div class="equipo">${o.equipo}</div>
            <div class="ot">OT ${o.ot}</div>
          </div>
          <span class="pill ${nv}">${pillText(o.avance, o.bloqueado)}</span>
        </div>
        <div class="tags" style="min-height:18px">${["belray","apoyo","anglo"].filter(g=>(o.grupos||[]).includes(g)).map(g=>`<span class="tag ${g==='belray'?'br':'aa'}">${ETQ[g]}</span>`).join("")}${(haySplit && (o.grupos||[]).some(g=>g==='belray'||g==='apoyo')) ? (o.gantt?'<span class="tag g">EN GANTT</span>':'<span class="tag p">SOLO PROGRAMADA</span>') : ''}${o.alerta?'<span class="tag obs">⚠ OBS. PLANIF.</span>':''}</div>
        <div class="actividad">${detalle}</div>
        <div class="prog-wrap">
          <div class="prog-top">
            <span class="prog-pct">${o.avance}%</span>
            <span class="prog-hrs">${o.hrs}h est · ${o.horasReal}h real</span>
          </div>
          <div class="bar"><div class="bar-fill fill-${nv}" style="width:${o.avance}%"></div></div>
        </div>
        ${gente ? `<div class="terreno"><span class="icon">●</span>${gente}</div>` : ""}
      </div>
    `;
  }).join("");
}

function render(todosLosDatos){
  ultimosDatos = todosLosDatos;
  const datosOtras = todosLosDatos.filter(d=>grupoDe(d.respons)==="otras");
  const datosActividades = todosLosDatos.filter(d=>grupoDe(d.respons)!=="otras");
  renderOtras(datosOtras);
  const datosBR = datosActividades.filter(d=>grupoDe(d.respons)==="belray");
  const datosAA = datosActividades.filter(d=>grupoDe(d.respons)==="apoyo");
  const datosAN = datosActividades.filter(d=>grupoDe(d.respons)==="anglo");
  const hayApoyo = datosAA.length>0 || datosAN.length>0;
  // Si hay actividades marcadas "Actividades Programadas GANTT", Bel-Ray se separa en GANTT y solo programadas
  const haySplit = datosActividades.some(d=>d.gantt);
  const datosBRg = haySplit ? fusionarElectroimanes(datosBR.filter(d=>d.gantt)) : datosBR;
  const datosBRp = haySplit ? datosBR.filter(d=>!d.gantt) : [];
  const G = indicadores(datosBRg);
  const A = indicadores(datosAA);
  const N = indicadores(datosAN);
  const personas = [...new Set(agruparPorOT(datosActividades).flatMap(o=>o.enTerreno))].length;

  // Bloques de indicadores: 1) Bel-Ray programadas GANTT (general)  2) Apoyo AA  3) Anglo + Terceros
  // Bel-Ray = borde sólido · Apoyo AA y Anglo + Terceros = borde punteado
  const k = (l,v,punt,cls)=>`<div class="kpi"${punt?' style="border-style:dashed"':''}><div class="label">${l}</div><div class="value ${cls||''}">${v}</div></div>`;
  const bloque = (etq, nota, X, punt, extra, azul)=>`
    <div class="kpi-grupo">
      <div class="kpi-titulo"><span class="kpi-tag${punt?' punt':''}${azul?' azul':''}">${etq}</span><span class="kpi-nota">${nota}</span></div>
      <div class="kpi-fila">Actividades</div>
      <div class="kpis k5">
        ${k("Actividades totales", X.acts.t, punt)}
        ${k("Completadas", X.acts.c, punt, "v-ok")}
        ${k("En proceso", X.acts.p, punt, "v-warn")}
        ${k("Pendientes", X.acts.n, punt, "v-crit")}
        ${k("Pausadas", X.acts.z, punt)}
      </div>
      <div class="kpi-fila">OT</div>
      <div class="kpis k5">
        ${k("OT totales", X.ots.t, punt)}
        ${k("Completadas", X.ots.c, punt, "v-ok")}
        ${k("En proceso", X.ots.p, punt, "v-warn")}
        ${k("Pendientes", X.ots.n, punt, "v-crit")}
        ${k("Pausadas", X.ots.z, punt)}
      </div>
      <div class="kpi-fila">Avance y horas</div>
      <div class="kpis k4">
        ${k(punt?"Avance":"Cumplimiento", X.avance+"<small>%</small>", punt)}
        ${k("Hrs Gantt de estas actividades", X.hrs.toFixed(1), punt)}
        ${k("Hrs reales medidas", X.real.toFixed(1), punt)}
        ${extra||""}
      </div>
    </div>`;
  const tituloBR = haySplit ? "BEL-RAY · PROGRAMADAS GANTT" : "BEL-RAY";
  document.getElementById("kpis").innerHTML =
    bloque(tituloBR, haySplit ? "Solo actividades del programa Bel-Ray que están en la carta Gantt · los electroimanes CT-4 y CT-3.1 cuentan junto a su correa"
                              : "Programa Bel-Ray", G, false, k("Personas en terreno (todos los grupos)", personas, false), true) +
    (datosAA.length ? bloque("APOYO AA", "Bel-Ray apoya a Anglo American", A, true) : "") +
    (datosAN.length ? bloque("ANGLO + TERCEROS", "Programa Anglo y terceros · no cuenta para el cumplimiento Bel-Ray", N, true) : "");

  // Bloque azul con el listado Bel-Ray (programadas Gantt)
  const otsG = ordenarOT(agruparPorOT(datosBRg));
  document.getElementById("bloqueBR").innerHTML = otsG.length ? `
    <div class="bloque-br">
      <div class="kpi-titulo"><span class="kpi-tag azul">${tituloBR}</span><span class="kpi-nota">${otsG.length} OT · ${G.acts.t} actividades</span></div>
      <div class="grid">${cardsHtml(otsG, haySplit)}</div>
    </div>` : "";

  const fb = document.getElementById("filtroResp");
  if(fb){
    const b=(k,t)=>`<button onclick="setFiltro('${k}')" style="cursor:pointer;font:inherit;font-size:12px;padding:5px 12px;border-radius:8px;border:1px solid ${filtro===k?'var(--acento,#4da3ff)':'#243049'};background:${filtro===k?'#10233f':'transparent'};color:${filtro===k?'#4da3ff':'#8A97AD'}">${t}</button>`;
    fb.innerHTML = hayApoyo ? b('todas','Todas')+" "+b('belray','Bel-Ray')+(haySplit?" "+b('gantt','Bel-Ray · Gantt')+" "+b('prog','Bel-Ray · Solo programadas'):"")+(datosAA.length?" "+b('apoyo','Apoyo AA'):"")+(datosAN.length?" "+b('anglo','Anglo + Terceros'):"") : "";
  }
  const base = filtro==="belray" ? datosBR : (filtro==="gantt" ? datosBRg : (filtro==="prog" ? datosBRp : (filtro==="apoyo" ? datosAA : (filtro==="anglo" ? datosAN : datosActividades))));
  const ots = ordenarOT(agruparPorOT(base));

  const grid = document.getElementById("grid");
  if(!ots.length){ grid.innerHTML = '<div class="empty">No hay OT cargadas.</div>'; return; }
  grid.innerHTML = cardsHtml(ots, haySplit);
}

// ====== CONEXIÓN AL SHEET (dos hojas, cruce por OT) ======
async function cargarSheet(){
  if(!SHEET_CSV_URL){
    render(DATOS_EJEMPLO);
    actualizarFooter("datos de ejemplo");
    return;
  }
  try{
    // 1) tareas críticas desde CAPTURA
    const resTareas = await fetch(SHEET_CSV_URL + "&_=" + Date.now());
    const tareas = parseCSV(await resTareas.text());

    // 2) personas en terreno desde REGISTRO_NFC (si está configurada)
    let personas = [];
    if(NFC_CSV_URL){
      const resNFC = await fetch(NFC_CSV_URL + "&_=" + Date.now());
      personas = parseNFC(await resNFC.text());
    }

    // 3) cruce por OT: a cada tarea le asigna quién está en terreno en esa OT
    tareas.forEach(t=>{
      t.enTerreno = personas
        .filter(p=> p.ot === t.ot && p.estado === "en terreno")
        .map(p=> p.persona);
    });

    render(tareas);
    actualizarFooter(NFC_CSV_URL ? "Sheet + NFC en vivo" : "Sheet en vivo (sin NFC)");
  }catch(e){
    render(DATOS_EJEMPLO);
    actualizarFooter("error de conexión, mostrando ejemplo");
  }
}

// Parser de REGISTRO_NFC → lista de {persona, ot, estado}
function parseNFC(texto){
  const lineas = texto.split("\n").filter(l=>l.trim());
  if(!lineas.length) return [];
  let headerIdx = 0;
  for(let i=0;i<Math.min(5,lineas.length);i++){
    const cols = parseLinea(lineas[i]).map(c=>c.trim().toLowerCase());
    if(cols.some(c=>c.includes("persona"))){ headerIdx = i; break; }
  }
  const headers = parseLinea(lineas[headerIdx]).map(h=>h.trim().toLowerCase());
  const idx = {
    persona: headers.findIndex(h=>h.includes("persona")),
    ot: headers.findIndex(h=>h==="ot"),
    estado: headers.findIndex(h=>h.includes("estado")),
  };
  const res = [];
  for(let i=headerIdx+1;i<lineas.length;i++){
    const c = parseLinea(lineas[i]);
    if(!c[idx.persona]) continue;
    res.push({
      persona: c[idx.persona]||"",
      ot: String(c[idx.ot]||"").trim(),
      estado: String(c[idx.estado]||"").trim().toLowerCase()
    });
  }
  return res;
}

// Parser CSV → filtra solo críticas. Busca la fila de encabezados real
// (tu Sheet tiene un título en la fila 1, los headers están en la fila 2).
function parseCSV(texto){
  const lineas = texto.split("\n").filter(l=>l.trim());
  // Busca entre las primeras 5 líneas la que contenga "equipo" → esa es el header real
  let headerIdx = 0;
  for(let i=0;i<Math.min(5,lineas.length);i++){
    const cols = parseLinea(lineas[i]).map(c=>c.trim().toLowerCase());
    if(cols.some(c=>c.includes("equipo"))){ headerIdx = i; break; }
  }
  const headers = parseLinea(lineas[headerIdx]).map(h=>h.trim().toLowerCase());
  const idx = {
    equipo: headers.findIndex(h=>h.includes("equipo")),
    ot: headers.findIndex(h=>h==="ot"),
    actividad: (function(){
      let i = headers.findIndex(h=>h==="actividad");
      if(i<0) i = headers.findIndex(h=>h.includes("actividad") && h!=="tipo actividad");
      return i;
    })(),
    avance: headers.findIndex(h=>h.includes("avance")),
    hrs: headers.findIndex(h=>h.includes("hrs")||h.includes("total")),
    criticidad: headers.findIndex(h=>h.includes("criticidad")),
    bloqueado: headers.findIndex(h=>h.includes("bloqueado")||h.includes("pausado")),
    duracionReal: headers.findIndex(h=>h.includes("duraci")),
    respons: headers.findIndex(h=>h==="responsabilidad"),
    estado: headers.findIndex(h=>h==="estado"),
    obs: headers.findIndex(h=>h.startsWith("observaci")),
    alerta: headers.findIndex(h=>h.startsWith("alerta")),
    tipoAct: headers.findIndex(h=>h==="tipo actividad"),
  };
  const filas = [];
  for(let i=headerIdx+1;i<lineas.length;i++){
    const c = parseLinea(lineas[i]);
    if(!c[idx.equipo] || !c[idx.equipo].trim()) continue;
    // TODAS las actividades del Gantt (ya no se filtra solo por criticidad)
    filas.push({
      equipo: c[idx.equipo]||"",
      ot: c[idx.ot]||"",
      actividad: c[idx.actividad]||"",
      avance: parseAvance(c[idx.avance]),
      hrs: parseNum(c[idx.hrs]),
      horasReal: idx.duracionReal>=0 ? parseNum(c[idx.duracionReal]) : 0,
      criticidad: c[idx.criticidad]||"",
      bloqueado: idx.bloqueado>=0 ? (c[idx.bloqueado]||"") : "",
      respons: idx.respons>=0 ? (c[idx.respons]||"").trim() : "",
      estado: idx.estado>=0 ? (c[idx.estado]||"").trim() : "",
      obs: idx.obs>=0 ? (c[idx.obs]||"").trim() : "",
      alerta: idx.alerta>=0 ? /^s[ií]/i.test((c[idx.alerta]||"").trim()) : false,
      gantt: idx.tipoAct>=0 ? /gantt/i.test(c[idx.tipoAct]||"") : false,   // Tipo Actividad = "Actividades Programadas GANTT"
      enTerreno: [] // se llena desde la hoja REGISTRO_NFC (ver Apps Script)
    });
  }
  return filas;
}
function parseLinea(linea){
  const res=[]; let cur=""; let dentro=false;
  for(let i=0;i<linea.length;i++){
    const ch=linea[i];
    if(ch==='"'){ dentro=!dentro; }
    else if(ch===',' && !dentro){ res.push(cur); cur=""; }
    else cur+=ch;
  }
  res.push(cur);
  return res.map(s=>s.trim());
}

function actualizarFooter(fuente){
  const ahora = new Date().toLocaleTimeString("es-CL",{timeZone:"America/Santiago"});
  document.getElementById("footer").textContent =
    `Última actualización: ${ahora} · Fuente: ${fuente} · Se refresca cada 30 segundos`;
}

function tick(){
  const ahora = new Date().toLocaleTimeString("es-CL",{timeZone:"America/Santiago"});
  document.getElementById("clock").textContent = ahora;
}

// ====== OTRAS ACTIVIDADES (Responsabilidad = "Otras": tienen OT pero no están en el Gantt) ======
function renderOtras(filas){
  const wrap = document.getElementById("otrasWrap");
  if(!wrap) return;
  if(!filas.length){ wrap.innerHTML = ""; return; }
  const lista = filas.slice().sort((a,b)=>{
    const sa = /^\d+$/.test(a.ot) ? 0 : 1, sb = /^\d+$/.test(b.ot) ? 0 : 1;
    return sa-sb || a.ot.localeCompare(b.ot);
  });
  wrap.innerHTML = `
    <div class="otras-title">Otras actividades · ${lista.length}</div>
    <div class="otras-sub">No están en la carta Gantt. No se incluyen en el cumplimiento.</div>
    <table class="otras-tabla">
      <thead><tr><th>OT</th><th>Equipo</th><th>Actividad</th><th>Estado</th><th>Avance</th></tr></thead>
      <tbody>${lista.map(f=>`<tr>
        <td class="mono">${f.ot && f.ot!=="-" ? f.ot : "Sin OT"}</td><td>${f.equipo}</td>
        <td>${f.actividad}${f.obs?`<div style="color:var(--dim);font-size:11px;margin-top:2px">${f.obs}</div>`:""}</td>
        <td>${f.estado||"—"}</td><td>${f.avance}%</td></tr>`).join("")}</tbody>
    </table>`;
}

// Init
tick(); setInterval(tick, 1000);
cargarSheet(); setInterval(cargarSheet, REFRESH_MS);

</script>
