<style>

    --bg:#0B1220; --panel:#131C2E; --panel2:#1A2438; --line:#243049; --line2:#1D2740;

    --verde:#3FB950; --verdeBg:#132819;
    --ambar:#E3A008; --ambarBg:#2A2109;
    --rojo:#F0616D; --rojoBg:#2A1216;
    --azul:#3B82F6; --azulBg:#0E1D33;
    --acento:#4FD1C5;
    --gris:#55627A;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; padding:18px 20px 28px; min-height:100vh}
  .wrap{max-width:1500px; margin:0 auto}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- Encabezado ---------- */
  .top{display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; border-bottom:1px solid var(--line); padding-bottom:12px; margin-bottom:14px}
  .brand{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
  .brand h1{font-size:19px; font-weight:650; letter-spacing:.5px}
  .brand .sub{font-size:12px; color:var(--muted)}
  .status{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:12px; color:var(--muted)}
  .btn-nav{color:var(--muted); text-decoration:none; font-size:12.5px; background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:6px 14px; cursor:pointer; font-family:inherit; white-space:nowrap}
  .btn-nav:hover{color:var(--text); border-color:var(--muted)}
  .btn-nav.off{opacity:.4; pointer-events:none}
  .live{display:flex; align-items:center; gap:6px; margin-left:6px}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--verde); animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .clock{font-variant-numeric:tabular-nums; font-size:14px; color:var(--text)}

  /* ---------- Tarjeta de control (todos los indicadores en un solo lugar) ---------- */
  .control{background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-bottom:18px}
  .tabs{display:flex; gap:2px; overflow-x:auto; border-bottom:1px solid var(--line); background:#0F1829; padding:0 6px; scrollbar-width:thin}
  .tab{appearance:none; border:0; background:transparent; color:var(--muted); font:inherit; font-size:13px; font-weight:600; padding:13px 14px 11px; cursor:pointer; white-space:nowrap; border-bottom:3px solid transparent; display:flex; align-items:center; gap:8px}
  .tab:hover{color:var(--text)}
  .tab .n{font-size:11px; font-weight:600; color:var(--dim); background:var(--panel2); border-radius:10px; padding:1px 7px}
  .tab.on{color:var(--text); border-bottom-color:var(--c)}
  .tab.on .n{background:var(--c); color:#fff}
  .tabs .corte{margin-left:auto; align-self:center; font-size:11px; color:var(--dim); padding:0 10px; white-space:nowrap}

  .ctl-body{padding:16px 18px 14px}
  .ctl-nota{font-size:12px; color:var(--muted); margin-bottom:12px}

  /* medidores: cumplimiento + plan a la fecha */

  .meters.m2{grid-template-columns:repeat(2,1fr)}
  .meter{padding:2px 18px 4px}
  .meter:first-child{padding-left:0}
  .meter:last-child{padding-right:0}
  .meter + .meter{border-left:1px solid var(--line)}
  .m-label{font-size:11px; letter-spacing:.9px; text-transform:uppercase; color:var(--muted); font-weight:600}
  .m-main{display:flex; align-items:baseline; gap:10px; margin:4px 0 8px; flex-wrap:wrap}
  .m-pct{font-size:36px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums}
  .m-pct small{font-size:18px; color:var(--muted); font-weight:500}
  .m-frac{font-size:12.5px; color:var(--muted)}
  .bullet{position:relative; height:10px; background:var(--panel2); border-radius:6px; overflow:visible}
  .b-fill{height:100%; border-radius:6px; background:var(--c)}
  .b-plan{position:absolute; top:-4px; width:3px; height:18px; background:#fff; border-radius:2px; box-shadow:0 0 0 2px var(--panel)}
  .m-plan{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:9px; font-size:12px; color:var(--muted); flex-wrap:wrap}
  .m-plan b{color:var(--text); font-weight:650}
  .gap{font-size:11px; font-weight:700; padding:2px 9px; border-radius:12px; white-space:nowrap}
  .gap.pos{background:var(--verdeBg); color:var(--verde)}
  .gap.neg{background:var(--rojoBg); color:var(--rojo)}
  .gap.eq{background:var(--panel2); color:var(--muted)}
  .m-leg{font-size:10.5px; color:var(--dim); margin-top:3px}
  .m-leg i{display:inline-block; width:3px; height:10px; background:#fff; border-radius:2px; vertical-align:-1px; margin-right:4px}

  /* estado: barras apiladas */
  .estados{display:grid; grid-template-columns:1fr 1fr; gap:0 28px; margin-top:16px; padding-top:14px; border-top:1px solid var(--line)}
  .estados.solo{grid-template-columns:1fr 1fr; margin-top:0; padding-top:0; border-top:0}
  .est-t{display:flex; justify-content:space-between; align-items:baseline; font-size:11px; letter-spacing:.9px; text-transform:uppercase; color:var(--muted); font-weight:600; margin-bottom:6px}
  .est-t b{font-size:15px; letter-spacing:0; color:var(--text); text-transform:none}
  .stack{display:flex; height:12px; border-radius:6px; overflow:hidden; background:var(--panel2)}
  .stack span{display:block; height:100%}
  .leyenda{display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:8px; font-size:12px; color:var(--muted)}
  .leyenda b{color:var(--text); font-weight:650; font-variant-numeric:tabular-nums}
  .sw{display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:5px; vertical-align:0}
  .c-ok{background:var(--verde)} .c-pr{background:var(--ambar)} .c-pe{background:var(--gris)} .c-pa{background:var(--rojo)}

  .hechos{display:flex; flex-wrap:wrap; gap:6px 26px; margin-top:14px; padding-top:12px; border-top:1px solid var(--line); font-size:12px; color:var(--muted)}
  .hechos b{color:var(--text); font-size:14px; font-weight:650; font-variant-numeric:tabular-nums; margin-left:4px}
  .pie{font-size:10.5px; color:var(--dim); margin-top:10px; line-height:1.4}

  /* ---------- Listado ---------- */
  .lista{border:1.5px solid var(--c, var(--line)); border-radius:14px; padding:14px; background:var(--panel-tint, transparent)}
  .lista-head{display:flex; justify-content:space-between; align-items:center; gap:10px 16px; flex-wrap:wrap; margin-bottom:12px}
  .lista-head h2{font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; font-weight:600}
  .lista-head h2 b{color:var(--text); letter-spacing:.5px}
  .chips{display:flex; flex-wrap:wrap; gap:6px}

  .chip.on{border-color:var(--acento); background:#10233f; color:#7FD8CF}
  .chip .n{opacity:.7; margin-left:4px}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:9px 11px; position:relative; overflow:hidden}
  .card.crit{border-left:3px solid var(--rojo)} .card.warn{border-left:3px solid var(--ambar)} .card.ok{border-left:3px solid var(--verde)}
  .card-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:2px; gap:6px}

  .actividad{font-size:10.5px; color:var(--muted); margin:3px 0 6px; line-height:1.3}
  .prog-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:3px}
  .prog-pct{font-size:16px; font-weight:700; font-variant-numeric:tabular-nums}
  .prog-hrs{font-size:9.5px; color:var(--dim)}
  .bar{height:6px; background:var(--panel2); border-radius:4px; overflow:hidden}
  .bar-fill{height:100%; border-radius:4px; transition:width .6s ease}
  .fill-ok{background:var(--verde)} .fill-warn{background:var(--ambar)} .fill-crit{background:var(--rojo)}
  .terreno{display:flex; align-items:center; flex-wrap:wrap; gap:4px; padding-top:5px; margin-top:4px; border-top:1px solid var(--line); font-size:9.5px}
  .terreno .icon{color:var(--acento); font-size:8px}
  .persona{background:var(--azulBg); color:#7FB2F5; padding:1px 6px; border-radius:10px; font-size:9.5px; font-weight:500}
  .empty{color:var(--dim); text-align:center; padding:34px; font-size:14px; grid-column:1/-1}

  .otras-sub{font-size:11px; color:var(--dim); margin-bottom:10px}
  .otras-tabla{width:100%; border-collapse:collapse; font-size:12px; background:var(--panel); border:1px solid var(--line); border-radius:10px; overflow:hidden}
  .otras-tabla th{text-align:left; font-weight:600; color:var(--dim); font-size:10px; letter-spacing:1px; text-transform:uppercase; padding:8px 10px; border-bottom:1px solid var(--line)}
  .otras-tabla td{padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; line-height:1.35}
  .otras-tabla tr:last-child td{border-bottom:none}
  .otras-tabla .mono{font-family:ui-monospace,monospace; font-size:11px; color:var(--dim); white-space:nowrap}

  .footer{margin-top:22px; text-align:center; font-size:11px; color:var(--dim)}

  @media(max-width:900px){
    .meters{grid-template-columns:1fr}
    .meter{padding:12px 0}
    .meter + .meter{border-left:0; border-top:1px solid var(--line)}
    .estados{grid-template-columns:1fr; gap:14px}
    .tabs .corte{display:none}
  }
  @media(max-width:640px){ body{padding:12px} .grid{grid-template-columns:1fr} .m-pct{font-size:32px} }
</style>
</head>

<script>
// ============================================================
//  CONFIGURACIÓN — URLs de las hojas publicadas como CSV
//    CAPTURA      → SHEET_CSV_URL (tareas)
//    REGISTRO_NFC → NFC_CSV_URL   (personas en terreno)
// ============================================================
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRuKIv4RpPLmGUOHTrClUnWR1MpW7RLIVczjE4MfweIp-KeuwoaPtnfQVpL2ohNXqitH4b93zFO9xPV/pub?gid=1096962834&single=true&output=csv";   // CAPTURA (tareas)
const NFC_CSV_URL   = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRuKIv4RpPLmGUOHTrClUnWR1MpW7RLIVczjE4MfweIp-KeuwoaPtnfQVpL2ohNXqitH4b93zFO9xPV/pub?gid=109866302&single=true&output=csv";   // REGISTRO_NFC (personas en terreno)
const REFRESH_MS = 30000; // 30 segundos

// Ventana planificada de cada OT en la carta Gantt: [inicio, término] (hora de Chile). Sirve para el "plan a la fecha".
const GANTT_FECHAS = {

  "4017023272": ["28-10-2026 21:00","29-10-2026 03:00"],

  "4016182590": ["29-10-2026 10:00","30-10-2026 02:00"],

  "4016568296": ["30-10-2026 23:00","31-10-2026 03:00"],
  "4016073710": ["31-10-2026 22:30","01-11-2026 10:30"],
};

const DATOS_EJEMPLO = [
  {equipo:"Molino SAG", ot:"4013457119", actividad:"Cambio sellos perimetrales", avance:25, hrs:8, horasReal:0, enTerreno:[], respons:"Bel-Ray", gantt:true},
  {equipo:"Molino de Bolas N°1", ot:"4013457118", actividad:"Cambio sellos perimetrales MLB001", avance:100, hrs:30, horasReal:0, enTerreno:[], respons:"Bel-Ray", gantt:true},
];

// ---------- utilidades de fecha (hora de Chile, sin depender de la zona del navegador) ----------
function ahoraCL(){
  const p = new Intl.DateTimeFormat("sv-SE",{timeZone:"America/Santiago",hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(new Date());
  const m = p.match(/(\d+)-(\d+)-(\d+)\D+(\d+):(\d+):(\d+)/);
  return Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+m[6]);
}
function aMs(s){ const m = String(s).match(/^(\d+)-(\d+)-(\d+)\s+(\d+):(\d+)/); return m ? Date.UTC(+m[3],+m[2]-1,+m[1],+m[4],+m[5]) : null; }
function ventana(ot){ const f = GANTT_FECHAS[String(ot).trim()]; return f ? {ini:aMs(f[0]), fin:aMs(f[1])} : null; }
const p2 = n => String(n).padStart(2,"0");
function fmtMs(ms){ const d = new Date(ms); return `${p2(d.getUTCDate())}-${p2(d.getUTCMonth()+1)} ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}`; }
function fmtMsFull(ms){ const d = new Date(ms); return `${p2(d.getUTCDate())}-${p2(d.getUTCMonth()+1)}-${d.getUTCFullYear()} ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}`; }

function parseNum(raw){ let v = parseFloat(String(raw||"").trim().replace(",",".")); return isNaN(v) ? 0 : v; }
function parseAvance(raw){ let v = parseFloat(String(raw||"").trim().replace("%","").replace(",",".")); return isNaN(v) ? 0 : Math.round(v); }

// ---------- reglas de estado (una sola definición para indicadores y tarjetas) ----------
const pausa = r => !!r.bloqueado && r.avance < 100;                    // pausada = con "Pausado por" y sin terminar
const claseAct = r => r.avance>=100 ? "c" : (pausa(r) ? "z" : (r.avance>0 ? "p" : "n"));
const claseOT  = rs => rs.every(r=>r.avance>=100) ? "c" : (rs.some(pausa) ? "z" : (rs.some(r=>r.avance>0) ? "p" : "n"));
const PILL = {c:"COMPLETADA", p:"EN PROCESO", n:"SIN INICIAR", z:"PAUSADA"};
const NIVEL = {c:"ok", p:"warn", z:"warn", n:"crit"};

const grupoDe = r => /apoyo/i.test(r||"") ? "apoyo" : (/otra/i.test(r||"") ? "otras" : (/anglo|tercero/i.test(r||"") ? "anglo" : "belray"));

// Todos los electroimanes cuentan como UNA sola actividad junto con su correa
const codCT = e => { const m=/ct-?\s*(\d+(?:\.\d+)?)/i.exec(e||""); return m?m[1]:""; };
function fusionarElectroimanes(rows){
  const copia = rows.map(r=>Object.assign({},r));
  const esEl = r => /electro\s*-?\s*im[aá]n/i.test(r.equipo);
  const res = copia.filter(r=>!esEl(r));
  copia.filter(esEl).forEach(e=>{
    const c = res.find(r=>r.ot===e.ot && /^correa/i.test(r.equipo) && codCT(r.equipo)===codCT(e.equipo));
    if(!c){ res.push(e); return; }
    if(!c._n){ c._n = 1; c._sum = c.avance; c.equipo += " + Electroimán"; if(c.comp) c.comp += " / E. Imán"; }
    c._n++; c._sum += e.avance;
    c.avance = Math.floor(c._sum/c._n);                 // llega a 100% solo cuando ambos están al 100%
    c.hrs += e.hrs; c.horasReal = (c.horasReal||0) + (e.horasReal||0);
    if(e.actividad && e.actividad!==c.actividad) c.actividad += " + " + e.actividad;
    if(e.enTerreno && e.enTerreno.length) c.enTerreno = (c.enTerreno||[]).concat(e.enTerreno);
    if(e.bloqueado && !c.bloqueado) c.bloqueado = e.bloqueado;
    if(e.alerta) c.alerta = true;
  });
  return res;
}

// ---------- una tarjeta por OT ----------
function agruparPorOT(datos){
  const mapa = {};
  datos.forEach(d=>{
    const g = mapa[d.ot] || (mapa[d.ot] = {ot:d.ot, equipos:[], filas:[], hrs:0, ganadas:0, real:0, sumAv:0, bloqueado:"", enTerreno:[], alerta:false});
    if(d.equipo && !g.equipos.includes(d.equipo)) g.equipos.push(d.equipo);
    (g.acts = g.acts||[]); if(d.actividad && !g.acts.includes(d.actividad)) g.acts.push(d.actividad);
    (g.comps = g.comps||[]); if(d.comp && !g.comps.includes(d.comp)) g.comps.push(d.comp);
    g.filas.push(d);
    g.hrs += d.hrs; g.ganadas += d.hrs*d.avance/100; g.real += d.horasReal||0; g.sumAv += d.avance;
    if(d.bloqueado && !g.bloqueado) g.bloqueado = d.bloqueado;
    if(d.alerta) g.alerta = true;
    if(d.enTerreno && d.enTerreno.length) g.enTerreno = g.enTerreno.concat(d.enTerreno);
  });
  return Object.values(mapa).map(g=>({
    ot:g.ot, equipo:g.equipos.join(" · "), actNombres:g.acts||[], comps:g.comps||[],
    avance: g.hrs>0 ? Math.round(g.ganadas/g.hrs*100) : (g.filas.length ? Math.round(g.sumAv/g.filas.length) : 0),   // con horas: ponderado; sin horas: promedio simple
    hrs:Math.round(g.hrs*10)/10, real:Math.round(g.real*10)/10,
    acts:g.filas.length, hechas:g.filas.filter(r=>r.avance>=100).length,
    estado:claseOT(g.filas), bloqueado:g.bloqueado, enTerreno:[...new Set(g.enTerreno)], alerta:g.alerta, vent:ventana(g.ot)
  }));
}

// ---------- indicadores de un grupo ----------
const pct = (a,b) => b>0 ? Math.round(a/b*100) : 0;
function resumenGrupo(rows, ahora){
  const acts = {t:rows.length, c:0, p:0, n:0, z:0};
  rows.forEach(r=>acts[claseAct(r)]++);
  const porOT = {};
  rows.forEach(r=>{ (porOT[r.ot] = porOT[r.ot]||[]).push(r); });
  const ots = {t:0, c:0, p:0, n:0, z:0};
  Object.values(porOT).forEach(rs=>{ ots.t++; ots[claseOT(rs)]++; });
  const hrs = rows.reduce((s,r)=>s+r.hrs,0);
  const ganadas = rows.reduce((s,r)=>s+r.hrs*r.avance/100,0);
  const real = rows.reduce((s,r)=>s+(r.horasReal||0),0);
  const personas = new Set(rows.flatMap(r=>r.enTerreno||[])).size;

  // PLAN A LA FECHA: qué debería llevar según la Gantt y qué llevo
  const pl = {actDeb:0, actLlevo:0, otDeb:0, otLlevo:0, hrsDeb:0, hrsLlevo:0, sinFecha:0};
  const otVistas = {};
  rows.forEach(r=>{
    const v = ventana(r.ot);
    if(!v){ pl.sinFecha++; return; }
    if(v.fin <= ahora) pl.actDeb++;
    if(r.avance >= 100) pl.actLlevo++;
    const frac = Math.min(1, Math.max(0, (ahora - v.ini) / (v.fin - v.ini || 1)));
    pl.hrsDeb += r.hrs * frac;                      // horas que debería haber ganado (prorrateo lineal entre inicio y término)
    pl.hrsLlevo += r.hrs * r.avance / 100;
    (otVistas[r.ot] = otVistas[r.ot] || {v, rs:[]}).rs.push(r);
  });
  Object.values(otVistas).forEach(o=>{ if(o.v.fin <= ahora) pl.otDeb++; if(claseOT(o.rs)==="c") pl.otLlevo++; });
  return {acts, ots, hrs, ganadas, real, personas, pl,
          pAct:pct(acts.c,acts.t), pOT:pct(ots.c,ots.t), pHrs:pct(ganadas,hrs)};
}

// ---------- componentes visuales ----------
function brecha(llevo, deb, unidad){
  const d = Math.round((llevo-deb)*(unidad?10:1))/(unidad?10:1);
  if(d>0) return `<span class="gap pos">+${d}${unidad||""} adelantado</span>`;
  if(d<0) return `<span class="gap neg">${String(d).replace("-","−")}${unidad||""} atrasado</span>`;
  return `<span class="gap eq">en plan</span>`;
}
function medidor(etq, pctVal, frac, tickPct, planHtml, color){
  const tick = tickPct==null ? "" : `<div class="b-plan" style="left:calc(${Math.min(100,Math.max(0,tickPct))}% - 1.5px)"></div>`;
  return `
    <div class="meter" style="--c:${color}">
      <div class="m-label">${etq}</div>
      <div class="m-main"><span class="m-pct">${pctVal==null?"—":pctVal+"<small>%</small>"}</span><span class="m-frac">${frac}</span></div>
      <div class="bullet"><div class="b-fill" style="width:${pctVal||0}%"></div>${tick}</div>
      <div class="m-plan">${planHtml}</div>
    </div>`;
}
function apilada(titulo, X){
  const seg = (k,c)=> X[k] ? `<span class="${c}" style="width:${X[k]/X.t*100}%"></span>` : "";
  return `
    <div>
      <div class="est-t"><span>${titulo}</span><b class="num">${X.c} <span style="font-weight:400;color:var(--muted);font-size:12px">de ${X.t} realizadas</span></b></div>
      <div class="stack">${seg("c","c-ok")}${seg("p","c-pr")}${seg("n","c-pe")}${seg("z","c-pa")}</div>
      <div class="leyenda">
        <span><i class="sw c-ok"></i>Completadas <b>${X.c}</b></span>
        <span><i class="sw c-pr"></i>En proceso <b>${X.p}</b></span>
        <span><i class="sw c-pe"></i>Pendientes <b>${X.n}</b></span>
        <span><i class="sw c-pa"></i>Pausadas <b>${X.z}</b></span>
      </div>
    </div>`;
}

const TABS = [
  {k:"gantt",  t:"Bel-Ray · Gantt",          c:"#3B82F6", full:true,  nota:"Actividades del programa Bel-Ray que están en la carta Gantt. Cada electroimán cuenta como una sola actividad junto a su correa."},
  {k:"apoyo",  t:"BR + AA Gantt",              c:"#A78BFA", full:true,  nota:"Actividades de la Gantt en que Bel-Ray apoya a Anglo American (Apoyo AA)."},
  {k:"prog",   t:"Actividades Complementarias", c:"#4FD1C5", full:false, nota:"Actividades programadas de Bel-Ray que no están en la Gantt (sin horas estimadas): avance por cantidad de actividades y OT."},
  {k:"adic",   t:"Adicionales",                c:"#E3A008", full:false, nota:"Programa Anglo + Terceros y actividades adicionales, solo las que ya registran avance mayor a 0%. Avance por cantidad de actividades y OT, sin horas."},
];
let tab = "gantt", chip = "todas", ultimos = [];
function setTab(k){ tab = k; chip = "todas"; render(ultimos); }
function setChip(k){ chip = k; render(ultimos); }
window.setTab = setTab; window.setChip = setChip;
function volver(){ if(history.length>1){ history.back(); } return false; }

function render(todos){
  ultimos = todos;
  const ahora = ahoraCL();
  const act = todos.filter(d=>grupoDe(d.respons)!=="otras");
  const BR = act.filter(d=>grupoDe(d.respons)==="belray");
  const haySplit = act.some(d=>d.gantt);
  const GR = {
    gantt: haySplit ? fusionarElectroimanes(BR.filter(d=>d.gantt)) : BR,
    prog:  haySplit ? BR.filter(d=>!d.gantt) : [],
    apoyo: act.filter(d=>grupoDe(d.respons)==="apoyo"),
    adic:  todos.filter(d=>/anglo|otras/.test(grupoDe(d.respons)) && d.avance>0),
  };
  const tabs = TABS;
  if(!tabs.some(t=>t.k===tab)) tab = "gantt";
  const T = tabs.find(t=>t.k===tab);
  const rows = GR[tab];
  const X = resumenGrupo(rows, ahora);
  const etqGantt = haySplit ? "Bel-Ray · Gantt" : "Bel-Ray";

  // ---------- tarjeta de control ----------
  let cuerpo;
  if(T.full){
    const P = X.pl, ptsH = X.hrs>0;
    cuerpo = `
      <div class="meters">
        ${medidor("Cumplimiento por actividades", X.pAct, `${X.acts.c} de ${X.acts.t} actividades realizadas`,
            pct(P.actDeb, X.acts.t), `<span>Debería llevar <b class="num">${P.actDeb}</b> · llevo <b class="num">${P.actLlevo}</b></span>${brecha(P.actLlevo,P.actDeb)}`, T.c)}
        ${medidor("Cumplimiento por OT", X.pOT, `${X.ots.c} de ${X.ots.t} OT realizadas`,
            pct(P.otDeb, X.ots.t), `<span>Debería llevar <b class="num">${P.otDeb}</b> · llevo <b class="num">${P.otLlevo}</b></span>${brecha(P.otLlevo,P.otDeb)}`, T.c)}
        ${medidor("Cumplimiento por horas Gantt", ptsH?X.pHrs:null, ptsH?`${X.ganadas.toFixed(1)} de ${X.hrs.toFixed(1)} h avanzadas`:"sin horas Gantt",
            ptsH?pct(P.hrsDeb, X.hrs):null, ptsH?`<span>Debería llevar <b class="num">${P.hrsDeb.toFixed(1)} h</b> · llevo <b class="num">${P.hrsLlevo.toFixed(1)} h</b></span>${brecha(P.hrsLlevo,P.hrsDeb,"h")}`:"", T.c)}
      </div>
      <div class="m-leg" style="margin-top:8px"><i></i>La marca blanca indica cuánto debería llevar a esta hora según la carta Gantt.</div>
      <div class="estados">${apilada("Actividades", X.acts)}${apilada("OT", X.ots)}</div>
      <div class="hechos">
        <span>Hrs Gantt de estas actividades<b>${X.hrs.toFixed(1)}</b></span>
        <span>Hrs avanzadas<b>${X.ganadas.toFixed(1)}</b></span>
        <span>Hrs reales medidas<b>${X.real.toFixed(1)}</b></span>
        <span>Personas en terreno<b>${X.personas}</b></span>
      </div>
      <div class="pie">Plan a la fecha: actividades y OT cuyo término en la Gantt ya pasó; horas con prorrateo lineal entre inicio y término.${P.sinFecha?` ${P.sinFecha} actividad${P.sinFecha===1?"":"es"} sin fecha en la Gantt no entra${P.sinFecha===1?"":"n"} al plan.`:""}</div>`;
  } else {
    cuerpo = `
      <div class="meters m2">
        ${medidor("Avance por actividades", X.pAct, `${X.acts.c} de ${X.acts.t} actividades realizadas`, null, `<span>Faltan <b class="num">${X.acts.t-X.acts.c}</b> por completar</span>`, T.c)}
        ${medidor("Avance por OT", X.pOT, `${X.ots.c} de ${X.ots.t} OT realizadas`, null, `<span>Faltan <b class="num">${X.ots.t-X.ots.c}</b> por completar</span>`, T.c)}
      </div>
      <div class="estados">${apilada("Actividades", X.acts)}${apilada("OT", X.ots)}</div>
      <div class="hechos"><span>Personas en terreno<b>${X.personas}</b></span></div>`;
  }
  document.getElementById("control").innerHTML = `
    <div class="tabs" role="tablist">
      ${tabs.map(t=>`<button class="tab${t.k===tab?" on":""}" style="--c:${t.c}" role="tab" onclick="setTab('${t.k}')">${t.k==="gantt"?etqGantt:t.t}<span class="n">${GR[t.k].length}</span></button>`).join("")}
      <span class="corte">Corte ${fmtMsFull(ahora)}</span>
    </div>
    <div class="ctl-body"><div class="ctl-nota">${T.nota}</div>${cuerpo}</div>`;

  // ---------- listado ----------
  const lista = document.getElementById("lista");
  lista.style.setProperty("--c", T.c);
  lista.style.setProperty("--panel-tint", `color-mix(in srgb, ${T.c} 7%, transparent)`);
  if(tab==="adic"){
    lista.innerHTML = `<div class="lista-head"><h2>Actividades · <b>Adicionales</b></h2></div>${tablaOtras(rows)}`;
    return;
  }
  let ots = agruparPorOT(rows);
  const cuenta = {c:0,p:0,n:0,z:0}; ots.forEach(o=>cuenta[o.estado]++);
  const chips = [["todas","Todas",ots.length],["c","Completadas",cuenta.c],["p","En proceso",cuenta.p],["n","Pendientes",cuenta.n],["z","Pausadas",cuenta.z]];
  if(chip!=="todas") ots = ots.filter(o=>o.estado===chip);
  ots.sort((a,b)=>{
    const pa = a.estado==="z"?0:1, pb = b.estado==="z"?0:1;
    if(pa!==pb) return pa-pb;
    return a.avance - b.avance;
  });
  lista.innerHTML = `
    <div class="lista-head">
      <h2>Frentes de trabajo · <b>${tab==="gantt"?etqGantt:T.t}</b></h2>
      <div class="chips">${chips.map(([k,t,n])=>`<button class="chip${chip===k?" on":""}" onclick="setChip('${k}')">${t}<span class="n">${n}</span></button>`).join("")}</div>
    </div>
    <div class="grid">${ots.length ? cardsHtml(ots, ahora) : '<div class="empty">No hay OT en este estado.</div>'}</div>`;
}

function cardsHtml(ots, ahora){
  return ots.map(o=>{
    const nv = NIVEL[o.estado];
    const gente = (o.enTerreno && o.enTerreno.length) ? o.enTerreno.map(p=>`<span class="persona">${p}</span>`).join(" ") : "";
    const vencida = o.vent && o.vent.fin <= ahora && o.estado!=="c";
    const detalle = o.bloqueado ? `⚠ ${o.bloqueado}` : `${o.acts} act. · ${o.hechas} OK` + (o.vent ? ` · Gantt ${fmtMs(o.vent.ini)} → ${fmtMs(o.vent.fin)}` : "");
    return `
      <div class="card ${nv}">
        <div class="card-head">
          <div><div class="equipo">${o.equipo}</div><div class="ot">OT ${o.ot}</div></div>
          <span class="pill ${nv}">${PILL[o.estado]}</span>
        </div>
        <div class="tags">${vencida?'<span class="tag venc">FUERA DE PLAZO</span>':''}${o.alerta?'<span class="tag obs">⚠ OBS. PLANIF.</span>':''}</div>
        <div class="act-nom">${o.actNombres.join(" · ")}</div>
        ${o.comps.length?`<div class="act-comp">${o.comps.join(" · ")}</div>`:""}
        <div class="actividad">${detalle}</div>
        <div class="prog-wrap">
          <div class="prog-top"><span class="prog-pct">${o.avance}%</span><span class="prog-hrs">${(o.hrs||o.real)?`${o.hrs}h est · ${o.real}h real`:`${o.hechas} de ${o.acts} act.`}</span></div>
          <div class="bar"><div class="bar-fill fill-${nv}" style="width:${o.avance}%"></div></div>
        </div>
        ${gente ? `<div class="terreno"><span class="icon">●</span>${gente}</div>` : ""}
      </div>`;
  }).join("");
}

// ====== ADICIONALES (Responsabilidad = "Otras"): tabla de cantidades, sin cumplimiento ======
function tablaOtras(filas){
  if(!filas.length) return '<div class="empty">Aún no hay actividades de Anglo + Terceros ni adicionales con avance mayor a 0%.</div>';
  const lista = filas.slice().sort((a,b)=>{
    const sa = /^\d+$/.test(a.ot) ? 0 : 1, sb = /^\d+$/.test(b.ot) ? 0 : 1;
    return sa-sb || a.ot.localeCompare(b.ot);
  });
  return `
    <div class="otras-sub">Solo actividades con avance mayor a 0%. No están en la carta Gantt: se informa cantidad realizada.</div>
    <table class="otras-tabla">
      <thead><tr><th>OT</th><th>Programa</th><th>Equipo</th><th>Componente</th><th>Actividad</th><th>Estado</th><th>Avance</th></tr></thead>
      <tbody>${lista.map(f=>`<tr>
        <td class="mono">${f.ot && f.ot!=="-" ? f.ot : "Sin OT"}</td><td>${grupoDe(f.respons)==="anglo"?"Anglo + Terceros":"Adicional"}</td><td>${f.equipo}</td><td>${f.comp||"—"}</td>
        <td>${f.actividad}${f.obs?`<div style="color:var(--dim);font-size:11px;margin-top:2px">${f.obs}</div>`:""}</td>
        <td>${f.estado||"—"}</td><td>${f.avance}%</td></tr>`).join("")}</tbody>
    </table>`;
}


// ====== CONEXIÓN AL SHEET (dos hojas, cruce por OT) ======
async function cargarSheet(){
  if(!SHEET_CSV_URL){
    render(DATOS_EJEMPLO);
    actualizarFooter("datos de ejemplo");
    return;
  }
  try{
    // 1) tareas críticas desde CAPTURA
    const resTareas = await fetch(SHEET_CSV_URL + "&_=" + Date.now());
    const tareas = parseCSV(await resTareas.text());

    // 2) personas en terreno desde REGISTRO_NFC (si está configurada)
    let personas = [];
    if(NFC_CSV_URL){
      const resNFC = await fetch(NFC_CSV_URL + "&_=" + Date.now());
      personas = parseNFC(await resNFC.text());
    }

    // 3) cruce por OT: a cada tarea le asigna quién está en terreno en esa OT
    tareas.forEach(t=>{
      t.enTerreno = personas
        .filter(p=> p.ot === t.ot && p.estado === "en terreno")
        .map(p=> p.persona);
    });

    render(tareas);
    actualizarFooter(NFC_CSV_URL ? "Sheet + NFC en vivo" : "Sheet en vivo (sin NFC)");
  }catch(e){
    render(DATOS_EJEMPLO);
    actualizarFooter("error de conexión, mostrando ejemplo");
  }
}

// Parser de REGISTRO_NFC → lista de {persona, ot, estado}
function parseNFC(texto){
  const lineas = texto.split("\n").filter(l=>l.trim());
  if(!lineas.length) return [];
  let headerIdx = 0;
  for(let i=0;i<Math.min(5,lineas.length);i++){
    const cols = parseLinea(lineas[i]).map(c=>c.trim().toLowerCase());
    if(cols.some(c=>c.includes("persona"))){ headerIdx = i; break; }
  }
  const headers = parseLinea(lineas[headerIdx]).map(h=>h.trim().toLowerCase());
  const idx = {
    persona: headers.findIndex(h=>h.includes("persona")),
    ot: headers.findIndex(h=>h==="ot"),
    estado: headers.findIndex(h=>h.includes("estado")),
  };
  const res = [];
  for(let i=headerIdx+1;i<lineas.length;i++){
    const c = parseLinea(lineas[i]);
    if(!c[idx.persona]) continue;
    res.push({
      persona: c[idx.persona]||"",
      ot: String(c[idx.ot]||"").trim(),
      estado: String(c[idx.estado]||"").trim().toLowerCase()
    });
  }
  return res;
}

// Parser CSV → filtra solo críticas. Busca la fila de encabezados real
// (tu Sheet tiene un título en la fila 1, los headers están en la fila 2).
function parseCSV(texto){
  const lineas = texto.split("\n").filter(l=>l.trim());
  // Busca entre las primeras 5 líneas la que contenga "equipo" → esa es el header real
  let headerIdx = 0;
  for(let i=0;i<Math.min(5,lineas.length);i++){
    const cols = parseLinea(lineas[i]).map(c=>c.trim().toLowerCase());
    if(cols.some(c=>c.includes("equipo"))){ headerIdx = i; break; }
  }
  const headers = parseLinea(lineas[headerIdx]).map(h=>h.trim().toLowerCase());
  const idx = {
    equipo: headers.findIndex(h=>h.includes("equipo")),
    ot: headers.findIndex(h=>h==="ot"),
    actividad: (function(){
      let i = headers.findIndex(h=>h==="actividad");
      if(i<0) i = headers.findIndex(h=>h.includes("actividad") && h!=="tipo actividad");
      return i;
    })(),
    avance: headers.findIndex(h=>h.includes("avance")),
    hrs: headers.findIndex(h=>h.includes("hrs")||h.includes("total")),
    criticidad: headers.findIndex(h=>h.includes("criticidad")),
    bloqueado: headers.findIndex(h=>h.includes("bloqueado")||h.includes("pausado")),
    duracionReal: headers.findIndex(h=>h.includes("duraci")),
    respons: headers.findIndex(h=>h==="responsabilidad"),
    estado: headers.findIndex(h=>h==="estado"),
    obs: headers.findIndex(h=>h.startsWith("observaci")),
    alerta: headers.findIndex(h=>h.startsWith("alerta")),
    tipoAct: headers.findIndex(h=>h==="tipo actividad"),
    comp: headers.findIndex(h=>h==="sistema componente"||h==="componente"),
  };
  const filas = [];
  for(let i=headerIdx+1;i<lineas.length;i++){
    const c = parseLinea(lineas[i]);
    if(!c[idx.equipo] || !c[idx.equipo].trim()) continue;
    // TODAS las actividades del Gantt (ya no se filtra solo por criticidad)
    filas.push({
      equipo: c[idx.equipo]||"",
      ot: c[idx.ot]||"",
      actividad: c[idx.actividad]||"",
      comp: idx.comp>=0 ? (c[idx.comp]||"").trim() : "",
      avance: parseAvance(c[idx.avance]),
      hrs: parseNum(c[idx.hrs]),
      horasReal: idx.duracionReal>=0 ? parseNum(c[idx.duracionReal]) : 0,
      criticidad: c[idx.criticidad]||"",
      bloqueado: idx.bloqueado>=0 ? (c[idx.bloqueado]||"") : "",
      respons: idx.respons>=0 ? (c[idx.respons]||"").trim() : "",
      estado: idx.estado>=0 ? (c[idx.estado]||"").trim() : "",
      obs: idx.obs>=0 ? (c[idx.obs]||"").trim() : "",
      alerta: idx.alerta>=0 ? /^s[ií]/i.test((c[idx.alerta]||"").trim()) : false,
      gantt: idx.tipoAct>=0 ? /gantt/i.test(c[idx.tipoAct]||"") : false,   // Tipo Actividad = "Actividades Programadas GANTT"
      enTerreno: [] // se llena desde la hoja REGISTRO_NFC (ver Apps Script)
    });
  }
  return filas;
}
function parseLinea(linea){
  const res=[]; let cur=""; let dentro=false;
  for(let i=0;i<linea.length;i++){
    const ch=linea[i];
    if(ch==='"'){ dentro=!dentro; }
    else if(ch===',' && !dentro){ res.push(cur); cur=""; }
    else cur+=ch;
  }
  res.push(cur);
  return res.map(s=>s.trim());
}

function actualizarFooter(fuente){
  const ahora = new Date().toLocaleTimeString("es-CL",{timeZone:"America/Santiago"});
  document.getElementById("footer").textContent =

}

}
