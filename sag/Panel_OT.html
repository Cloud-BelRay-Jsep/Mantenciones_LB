<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel OT · Bel-Ray — Anglo American Los Bronces</title>
<style>
  :root{
    --bg:#0B1220; --panel:#131C2E; --panel2:#1A2438; --line:#243049;
    --text:#E8EDF6; --muted:#8A97AD; --dim:#5E6B82;
    --verde:#3FB950; --verdeBg:#132819;
    --ambar:#E3A008; --ambarBg:#2A2109;
    --rojo:#F0616D; --rojoBg:#2A1216;
    --azul:#3B82F6; --azulBg:#0E1D33;
    --acento:#4FD1C5;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    padding:24px; min-height:100vh;
  }
  .top{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:1px solid var(--line); padding-bottom:16px; margin-bottom:22px}
  .brand{display:flex; align-items:center; gap:16px}
  .brand-logo{height:52px; width:auto; flex-shrink:0}
  .brand-text{display:flex; flex-direction:column; gap:4px}
  .brand .tag{font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:1px}
  .brand h1{font-size:30px; font-weight:700}
  .brand .sub{font-size:14px; color:var(--muted)}
  .status{display:flex; align-items:center; gap:18px; font-size:13px; color:var(--muted)}
  .live{display:flex; align-items:center; gap:6px}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--verde); animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
  .clock{font-variant-numeric:tabular-nums; font-size:16px; color:var(--text)}

  .layout{display:grid; grid-template-columns:300px 1fr 360px; gap:18px; height:calc(100vh - 150px)}
  @media(max-width:1100px){.layout{grid-template-columns:1fr; height:auto}}
  .col{display:flex; flex-direction:column; min-height:0}
  .col-scroll{overflow-y:auto; flex:1; padding-right:4px}
  .col-scroll::-webkit-scrollbar{width:6px}
  .col-scroll::-webkit-scrollbar-thumb{background:var(--line); border-radius:3px}

  .hero{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:26px; text-align:center}
  .ring-wrap{position:relative; width:200px; height:200px; margin:0 auto 18px}
  .ring-pct{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column}
  .ring-pct .num{font-size:44px; font-weight:800; font-variant-numeric:tabular-nums}
  .ring-pct .lbl{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-top:2px}
  .hero-stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:20px}
  .hstat{background:var(--panel2); border-radius:10px; padding:10px}
  .hstat .v{font-size:20px; font-weight:700}
  .hstat .l{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin-top:2px}
  .pill-estado{display:inline-block; margin-top:14px; font-size:12px; font-weight:700; padding:5px 14px; border-radius:20px}
  .btn-docs-terreno{
    display:block; margin:10px auto 0; background:var(--panel2); border:1px solid var(--line);
    color:var(--text); font-size:12px; padding:8px 16px; border-radius:20px; cursor:pointer; font-family:inherit;
  }
  .btn-docs-terreno:hover{border-color:var(--acento); color:var(--acento)}

  .metrics{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:16px}
  .metric{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px}
  .metric .v{font-size:26px; font-weight:700; font-variant-numeric:tabular-nums}
  .metric .l{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin-top:2px}

  .section-title{font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin:0 0 12px}

  .act-card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:11px 14px; margin-bottom:7px}
  .act-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px; gap:8px}
  .act-name{font-size:13.5px; font-weight:600}
  .act-resp{font-size:11px; color:var(--dim)}
  .etapas{margin-top:10px; padding-top:10px; border-top:1px solid var(--line)}
  .et-head{display:flex; justify-content:space-between; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin-bottom:8px}
  .et-row{display:flex; gap:10px; align-items:flex-start; margin-bottom:9px}
  .et-n{flex:0 0 22px; height:22px; border-radius:50%; background:var(--panel2); color:var(--muted); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px}
  .et-main{flex:1; min-width:0}
  .et-top{display:flex; align-items:baseline; gap:8px; margin-bottom:4px}
  .et-nombre{font-size:12.5px; font-weight:600; flex:1; min-width:0}
  .et-pill{font-size:9px; font-weight:700; padding:2px 7px; border-radius:9px; white-space:nowrap}
  .et-pct{font-size:12px; font-weight:700; min-width:34px; text-align:right}
  .et-obs{font-size:11px; color:var(--dim); margin-top:3px}
  .et-vacio{font-size:11px; color:var(--dim); margin-top:8px}
  .lub-box{margin-top:16px}
  .lub-en-act{margin-top:10px; padding-top:10px; border-top:1px solid var(--line)}
  .lub-en-act .lub-row{background:var(--panel2); margin-bottom:6px}
  .lub-row{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px}
  .lub-punto{font-size:12px; color:var(--muted); line-height:1.35}
  .lub-main{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-top:4px}
  .lub-nombre{font-size:14px; font-weight:600; line-height:1.25}
  .lub-marca{font-size:10px; color:var(--dim); font-weight:600; letter-spacing:.5px; text-transform:uppercase; margin-right:6px}
  .lub-cant{font-size:15px; font-weight:700; white-space:nowrap}
  .lub-cant small{font-size:11px; font-weight:500; color:var(--muted)}
  .lub-pend{font-size:12px; color:var(--ambar)}
  .lub-docs{display:flex; gap:8px; margin-top:8px}
  .lub-docs a{font-size:11px; font-weight:600; color:var(--text); text-decoration:none; border:1px solid var(--line); border-radius:6px; padding:4px 10px; background:rgba(255,255,255,.04)}
  .lub-docs a:hover{border-color:var(--muted)}
  .lub-obs{font-size:11px; color:var(--dim); margin-top:4px; line-height:1.35}
  .act-pct{font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; flex-shrink:0}
  .bar{height:7px; background:var(--panel2); border-radius:6px; overflow:hidden}
  .bar-fill{height:100%; border-radius:6px; transition:width 0.6s ease}
  .fill-ok{background:var(--verde)} .fill-warn{background:var(--ambar)} .fill-crit{background:var(--rojo)}
  .act-pill{font-size:9.5px; font-weight:700; padding:2px 7px; border-radius:12px; margin-left:6px}

  .turno-header{
    font-size:11.5px; font-weight:700; color:var(--acento); text-transform:uppercase; letter-spacing:0.5px;
    margin:14px 0 8px; padding-bottom:5px; border-bottom:1px solid var(--line);
  }
  .turno-header:first-child{margin-top:0}
  .persona-row{display:flex; flex-direction:column; gap:6px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:7px}
  .persona-row.activo{border-color:var(--verde)}
  .p-head{display:flex; align-items:center; gap:8px}
  .p-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0}
  .p-dot.on{background:var(--verde); animation:pulse 2s infinite}
  .p-dot.off{background:var(--dim)}
  .p-nombre{font-size:13.5px; font-weight:600; flex:1; cursor:pointer; text-decoration:underline dotted; text-underline-offset:3px}
  .p-nombre:hover{color:var(--acento)}

  .modal-overlay{position:fixed; inset:0; background:rgba(5,8,15,0.75); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px}
  .modal-box{background:var(--panel); border:1px solid var(--line); border-radius:14px; max-width:520px; width:100%; max-height:80vh; overflow-y:auto; padding:22px}
  .modal-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px}
  .modal-nombre{font-size:19px; font-weight:700}
  .modal-cargo{font-size:13px; color:var(--muted); margin-top:2px}
  .modal-close{background:var(--panel2); border:none; color:var(--text); width:28px; height:28px; border-radius:50%; cursor:pointer; font-size:16px; flex-shrink:0}
  .cert-row{background:var(--panel2); border-radius:10px; padding:12px 14px; margin-bottom:8px}
  .cert-top{display:flex; justify-content:space-between; align-items:center; gap:8px}
  .cert-nombre{font-size:13.5px; font-weight:600}
  .cert-pill{font-size:10px; font-weight:700; padding:3px 9px; border-radius:12px; white-space:nowrap}
  .cert-fecha{font-size:11.5px; color:var(--dim); margin-top:4px}
  .cert-link{font-size:11.5px; color:var(--acento); margin-top:6px; display:inline-block; text-decoration:none}
  .cert-link:hover{text-decoration:underline}
  .p-horas{display:flex; gap:12px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; padding-left:16px}
  .p-horas .h-in{color:var(--verde)}
  .p-horas .h-out{color:var(--rojo)}
  .p-dur{font-size:11px; color:var(--dim); background:var(--panel2); padding:2px 8px; border-radius:10px}

  .hero{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; text-align:center}
  .ring-wrap{position:relative; width:150px; height:150px; margin:0 auto 12px}
  .ring-pct .num{font-size:34px; font-weight:800; font-variant-numeric:tabular-nums}
  .hero-stats{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px}
  .hstat{background:var(--panel2); border-radius:9px; padding:8px}
  .hstat .v{font-size:17px; font-weight:700}
  .hstat .l{font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.3px; margin-top:1px}
  .metrics{display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:12px}
  .metric{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:11px}
  .metric .v{font-size:21px; font-weight:700; font-variant-numeric:tabular-nums}
  .metric .l{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.3px; margin-top:1px}

  .empty{color:var(--dim); text-align:center; padding:30px; font-size:14px}
  .footer{margin-top:24px; text-align:center; font-size:11px; color:var(--dim)}

  .selector{max-width:100%; margin:20px auto}

  .buscador-ot{margin-bottom:12px}
  .buscador-ot input{width:100%; box-sizing:border-box; background:var(--panel); border:1px solid var(--line); border-radius:10px; color:var(--text); font-size:15px; padding:11px 14px; outline:none}
  .buscador-ot input:focus{border-color:var(--muted)}
  .buscador-cnt{font-size:12px; color:var(--muted); margin-top:6px}
  .btn-volver{color:var(--muted); text-decoration:none; font-size:13px; background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:6px 14px}
  .btn-volver:hover{color:var(--text); border-color:var(--muted)}
  .vista-toggle{display:flex; gap:8px; margin-bottom:16px}
  .vt-btn{
    background:var(--panel); border:1px solid var(--line); color:var(--muted);
    padding:8px 18px; border-radius:20px; font-size:13px; cursor:pointer; font-family:inherit;
  }
  .vt-btn.activo{background:var(--azulBg); border-color:var(--acento); color:var(--acento); font-weight:600}
  .vt-btn:hover{color:var(--text)}
  .resp-badge{display:inline-block; font-size:9px; font-weight:700; letter-spacing:.6px; padding:1px 6px; border-radius:4px; margin-left:6px; vertical-align:middle; border:1px solid var(--muted); color:var(--muted)}
  .resp-badge.br{border:1.5px solid var(--text); color:var(--text)}
  .resp-badge.aa{border:1.5px dashed var(--muted); color:var(--muted)}
  .alerta-badge{display:inline-block; font-size:9px; font-weight:700; padding:1px 6px; border-radius:4px; margin-left:6px; border:1px solid var(--ambar); color:var(--ambar)}
  .filtro-resp{display:flex; gap:6px; margin:0 0 12px; flex-wrap:wrap}
  .act-obs{margin-top:6px; font-size:11px; color:var(--muted); line-height:1.4}
  .act-obs b{color:var(--text); font-weight:600}
  .ot-pick.apoyo, .gantt-bar.apoyo{border-style:dashed !important}

  .timeline-item{display:flex; align-items:stretch; gap:14px; margin-bottom:10px}
  .time-badge{
    flex-shrink:0; width:64px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; color:var(--text); background:var(--panel2);
    border-radius:10px; font-variant-numeric:tabular-nums; padding:4px 0;
  }
  .time-badge .hasta{font-size:8px; color:var(--dim); font-weight:400; text-transform:uppercase; margin:1px 0}
  .timeline-card{flex:1; min-width:0}
  .timeline-card .ot-pick{margin-bottom:0}

  .gantt-hint{font-size:11px; color:var(--dim); text-align:center; margin-top:8px}
  .gantt-bar.compacta{height:26px; padding:0 6px; border-radius:5px; justify-content:center}
  .gb-corto{font-size:10px; font-weight:700; color:var(--text); overflow:hidden; text-overflow:ellipsis}

  .gantt-scroll{overflow-x:auto; overflow-y:hidden; border:1px solid var(--line); border-radius:12px; background:var(--panel)}
  .gantt-inner{position:relative}
  .gantt-header{display:flex; position:sticky; top:0; z-index:2; background:var(--panel); border-bottom:1px solid var(--line)}
  .gantt-daycol{
    flex-shrink:0; text-align:center; padding:10px 0; font-size:12px; font-weight:700;
    color:var(--acento); text-transform:uppercase; letter-spacing:0.5px;
    border-right:1px solid var(--line);
  }
  .gantt-daycol .fecha{display:block; font-size:10px; color:var(--muted); font-weight:400; margin-top:2px; text-transform:none}
  .gantt-body{position:relative}
  .gantt-gridline{position:absolute; top:0; bottom:0; width:1px; background:var(--line); opacity:0.5}
  .gantt-bar{
    position:absolute; border-radius:8px; border-left:3px solid; display:flex;
    flex-direction:column; justify-content:center; padding:5px 9px; overflow:hidden;
    text-decoration:none; box-sizing:border-box;
  }
  .gantt-bar .gb-nombre{
    font-size:10.5px; font-weight:700; color:var(--text); line-height:1.25;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .gantt-bar .gb-actividad{
    font-size:9.5px; color:var(--text); opacity:0.85; line-height:1.25; margin-top:1px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .gantt-bar .gb-hora{font-size:9px; color:var(--muted); margin-top:2px; white-space:nowrap}
  .gantt-bar.completada{background:var(--verdeBg); border-left-color:var(--verde)}
  .gantt-bar.en-proceso{background:var(--ambarBg); border-left-color:var(--ambar)}
  .gantt-bar.sin-iniciar{background:var(--rojoBg); border-left-color:var(--rojo)}
  .gantt-bar.pausada{background:rgba(91,200,232,0.15); border-left-color:#5BC8E8}
  .gantt-bar:hover{outline:1px solid var(--acento)}
  .dia-header{
    font-size:13px; font-weight:700; color:var(--acento); text-transform:uppercase; letter-spacing:1px;
    margin:26px 0 12px; padding-bottom:6px; border-bottom:1px solid var(--line);
  }
  .sinfecha-header{margin-top:22px; color:var(--dim)}
  .ot-pick{display:block; text-decoration:none; color:var(--text); background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:10px}
  .ot-pick.completada{border-left-color:var(--verde); background:linear-gradient(90deg, var(--verdeBg) 0%, var(--panel) 12%)}
  .ot-pick.en-proceso{border-left-color:var(--ambar); background:linear-gradient(90deg, var(--ambarBg) 0%, var(--panel) 12%)}
  .ot-pick.sin-iniciar{border-left-color:var(--rojo); background:linear-gradient(90deg, var(--rojoBg) 0%, var(--panel) 12%)}
  .ot-pick.pausada{border-left-color:#5BC8E8; background:linear-gradient(90deg, rgba(91,200,232,0.15) 0%, var(--panel) 12%)}
  .ot-tag{font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; margin-left:8px; vertical-align:middle}
  .ot-pick.completada .ot-tag{background:var(--verdeBg); color:var(--verde)}
  .ot-pick.en-proceso .ot-tag{background:var(--ambarBg); color:var(--ambar)}
  .ot-pick.sin-iniciar .ot-tag{background:var(--rojoBg); color:var(--rojo)}
  .ot-pick.pausada .ot-tag{background:rgba(91,200,232,0.18); color:#5BC8E8}
  .ot-pick:hover{border-color:var(--acento)}
  .ot-pick .n{font-size:16px; font-weight:600}
  .ot-pick .s{font-size:12px; color:var(--muted); margin-top:2px}
</style>
</head>
<body>
  <div class="top">
    <div class="brand">
      <img class="brand-logo" src="logo-belray.png" alt="Bel-Ray">
      <div class="brand-text">
        <span class="tag">Panel de Actividad · Bel-Ray</span>
        <h1 id="tituloOT">Cargando…</h1>
        <span class="sub" id="subOT">Anglo American Los Bronces</span>
      </div>
    </div>
    <div class="status">
      <a id="btnVolver" href="index.html" class="btn-volver">← Volver</a>
      <a href="Acreditaciones.html" style="color:var(--muted); text-decoration:none; font-size:13px; background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:6px 14px" onmouseover="this.style.color='var(--acento)'" onmouseout="this.style.color='var(--muted)'">👤 Acreditaciones</a>
      <div class="live"><span class="dot"></span> EN VIVO</div>
      <div class="clock" id="clock">--:--:--</div>
    </div>
  </div>

  <div id="contenido">
    <div class="empty">Cargando datos…</div>
  </div>

  <div class="footer" id="footer">Última actualización: — · Se refresca cada 20 segundos</div>

<script>
const CAPTURA_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRuKIv4RpPLmGUOHTrClUnWR1MpW7RLIVczjE4MfweIp-KeuwoaPtnfQVpL2ohNXqitH4b93zFO9xPV/pub?gid=1096962834&single=true&output=csv";
const NFC_CSV_URL     = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRuKIv4RpPLmGUOHTrClUnWR1MpW7RLIVczjE4MfweIp-KeuwoaPtnfQVpL2ohNXqitH4b93zFO9xPV/pub?gid=109866302&single=true&output=csv";
// Publica la pestaña CERTIFICACIONES igual que las otras (Archivo > Compartir > Publicar en la web > CSV) y pega su link aquí:
const CERTS_CSV_URL   = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRuKIv4RpPLmGUOHTrClUnWR1MpW7RLIVczjE4MfweIp-KeuwoaPtnfQVpL2ohNXqitH4b93zFO9xPV/pub?gid=1733484865&single=true&output=csv";
// Pestaña LUBRICANTES_OT publicada como CSV (OT, Equipo, Punto, Marca, Lubricante, Cantidad, Unidad, Observación)
// Hoja OPERACIONES_OT (etapas por actividad). Publicar la pestaña como CSV y pegar aquí su link.
const OPERACIONES_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRuKIv4RpPLmGUOHTrClUnWR1MpW7RLIVczjE4MfweIp-KeuwoaPtnfQVpL2ohNXqitH4b93zFO9xPV/pub?gid=1094892331&single=true&output=csv";
const LUBRICANTES_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRuKIv4RpPLmGUOHTrClUnWR1MpW7RLIVczjE4MfweIp-KeuwoaPtnfQVpL2ohNXqitH4b93zFO9xPV/pub?gid=1903420084&single=true&output=csv";
const DOCS_TERRENO_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRuKIv4RpPLmGUOHTrClUnWR1MpW7RLIVczjE4MfweIp-KeuwoaPtnfQVpL2ohNXqitH4b93zFO9xPV/pub?gid=2126357148&single=true&output=csv";
const REFRESH_MS = 20000;

const params = new URLSearchParams(window.location.search);
const OT_SELECCIONADA = (params.get("ot") || "").trim();
const EQUIPO_SELECCIONADO = (params.get("equipo") || "").trim();   // opcional: una OT puede tener varios equipos
function hrefOT(o){ return "?ot=" + encodeURIComponent(o.ot) + (o.equipo ? "&equipo=" + encodeURIComponent(o.equipo) : ""); }

function parseLinea(linea){
  const res=[]; let cur=""; let dentro=false;
  for(let i=0;i<linea.length;i++){
    const ch=linea[i];
    if(ch==='"'){ dentro=!dentro; }
    else if(ch===',' && !dentro){ res.push(cur); cur=""; }
    else cur+=ch;
  }
  res.push(cur);
  return res.map(s=>s.trim());
}
function parseNum(raw){
  let s = String(raw||"").trim().replace(",",".");
  let v = parseFloat(s);
  return isNaN(v) ? 0 : v;
}

function parseAvance(raw){
  let s = String(raw||"").trim().replace("%","").replace(",",".");
  let v = parseFloat(s);
  if(isNaN(v)) return 0;
  return Math.round(v);
}

function encontrarHeader(lineas, clave){
  for(let i=0;i<Math.min(5,lineas.length);i++){
    const cols = parseLinea(lineas[i]).map(c=>c.trim().toLowerCase());
    if(cols.some(c=>c.includes(clave))) return i;
  }
  return 0;
}

async function cargarOperaciones(){
  if(!OPERACIONES_CSV_URL) return [];
  try{
    const res = await fetch(OPERACIONES_CSV_URL + (OPERACIONES_CSV_URL.includes("?")?"&":"?") + "_=" + Date.now());

    const hIdx = encontrarHeader(lineas, "operaci");
    const h = parseLinea(lineas[hIdx]).map(x=>x.trim().toLowerCase());
    const f = n => h.findIndex(x=>x===n || x.startsWith(n));
    const ix = {ot:f("ot"), equipo:f("equipo"), act:f("actividad"), orden:f("orden"), op:f("operaci"),
                av:f("avance"), estado:f("estado"), hrs:f("hrs"), obs:f("observaci")};
    const g = (c,i)=> i>=0 ? (c[i]||"").trim() : "";
    const out = [];
    for(let i=hIdx+1;i<lineas.length;i++){
      const c = parseLinea(lineas[i]);
      const ot = g(c,ix.ot).replace(/\.0$/,"");
      const op = g(c,ix.op);
      if(!ot || !op) continue;
      const rawAv = g(c,ix.av).replace("%","").replace(",",".");
      let av = parseFloat(rawAv); if(isNaN(av)) av = 0;
      if(g(c,ix.av).indexOf("%")<0 && av>0 && av<=1) av = av*100;
      av = Math.max(0, Math.min(100, Math.round(av)));
      const ord = parseFloat(g(c,ix.orden).replace(",","."));
      const hrs = parseFloat(g(c,ix.hrs).replace(",","."));
      out.push({ot, equipo:g(c,ix.equipo), actividad:g(c,ix.act), orden:isNaN(ord)?9999:ord, fila:i, op,
                avance:av, estado:g(c,ix.estado), hrs:isNaN(hrs)?0:hrs, obs:g(c,ix.obs)});
    }
    return out;
  }catch(e){ return []; }
}

// Normaliza quitando tildes, espacios extra y mayúsculas (para comparar nombres)
function normName(s){
  return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .trim().toLowerCase().replace(/\s+/g," ");
}
// Coincidencia flexible: todas las palabras del nombre más corto deben estar en el más largo
function personaCoincide(a, b){
  const na = normName(a), nb = normName(b);
  if(!na || !nb) return false;
  if(na===nb) return true;
  const ta = na.split(" "), tb = nb.split(" ");
  const corto = ta.length<=tb.length ? ta : tb;
  const largo = ta.length<=tb.length ? tb : ta;
  return corto.every(t=>largo.includes(t));
}

function formatFecha(d){
  if(!(d instanceof Date) || isNaN(d)) return "";
  const dd=String(d.getDate()).padStart(2,"0"), mm=String(d.getMonth()+1).padStart(2,"0");
  return `${dd}-${mm}-${d.getFullYear()}`;
}
function parseFechaFlexible(s){
  if(!s) return null;
  const txt = String(s).trim();
  // "DD-MM-YYYY" (sin hora) es ambiguo para el parser nativo de JS (lo confunde con MM-DD-YYYY
  // al estilo estadounidense) — lo interpretamos SIEMPRE como fecha chilena primero.
  const soloFecha = txt.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
  if(soloFecha){
    const d = new Date(parseInt(soloFecha[3]), parseInt(soloFecha[2])-1, parseInt(soloFecha[1]));
    if(!isNaN(d)) return d;
  }
  let d = new Date(txt); // ISO 8601 nativo ("2025-03-06T03:00:00.000Z") u otros formatos con hora
  if(!isNaN(d)) return d;
  const p = txt.split("-"); // último respaldo dd-mm-yyyy
  if(p.length===3){ d = new Date(parseInt(p[2]), parseInt(p[1])-1, parseInt(p[0])); if(!isNaN(d)) return d; }
  return null;
}

function estadoCert(vencStr){
  const venc = parseFechaFlexible(vencStr);
  if(!venc) return {txt:"SIN VENCIMIENTO", col:"var(--dim)", bg:"var(--panel)"};
  const hoy = new Date();
  const dias = Math.round((venc-hoy)/86400000);
  if(dias<0) return {txt:"VENCIDO", col:"var(--rojo)", bg:"var(--rojoBg)"};
  if(dias<=30) return {txt:"POR VENCER", col:"var(--ambar)", bg:"var(--ambarBg)"};
  return {txt:"VIGENTE", col:"var(--verde)", bg:"var(--verdeBg)"};
}

      return;

    if(!filtrados.length){

      return;
    }
    // agrupa por fecha + turno (el turno ya viene como texto desde la hoja)
    const grupos = {}, orden = [];
    filtrados.forEach(d=>{
      const key = (d.fecha||"—") + "|" + (d.turno||"—");
      if(!grupos[key]){ grupos[key] = { fecha:d.fecha, turno:d.turno, items:[] }; orden.push(key); }
      grupos[key].items.push(d);
    });
    // ordena por fecha descendente (más reciente primero)
    orden.sort((ka,kb)=>{
      const fa = parseFechaFlexible(grupos[ka].fecha), fb = parseFechaFlexible(grupos[kb].fecha);
      if(!fa && !fb) return 0;
      if(!fa) return 1;
      if(!fb) return -1;
      return fb-fa;
    });
    cuerpo.innerHTML = orden.map(key=>{
      const g = grupos[key];
      const esNoche = String(g.turno).toLowerCase().includes("noche");
      const icono = esNoche ? "🌙" : "☀️";
      const fFmt = formatFecha(parseFechaFlexible(g.fecha)) || g.fecha || "Sin fecha";
      const encabezado = `${icono} ${fFmt} · ${g.turno||"—"}`;
      const items = g.items.map(d=>`
        <div class="cert-row">
          <div class="cert-top">
            <span class="cert-nombre">${d.tarea||"Documento"}</span>
          </div>
          ${d.equipo ? `<div class="cert-fecha">${d.equipo}</div>` : ""}
          ${d.link ? `<a class="cert-link" href="${d.link}" target="_blank" rel="noopener">Ver / descargar documento →</a>` : ""}
        </div>`).join("");
      return `<div class="turno-header">${encabezado}</div>${items}`;
    }).join("");
  });
}

function nivel(av){ if(av>=100) return "ok"; if(av<50) return "crit"; return "warn"; }

// Clasifica una entrada en Turno Día (08:00–20:29) o Turno Noche (20:30–07:59).
// El turno noche que cruza medianoche se agrupa bajo la fecha en que EMPEZÓ.
function clasificarTurno(fechaStr, horaStr){
  if(!fechaStr || !horaStr) return null;
  const [dd,mm,yyyy] = fechaStr.split("-").map(Number);
  const [hh,mi] = horaStr.split(":").map(Number);
  if(isNaN(dd)||isNaN(mm)||isNaN(yyyy)||isNaN(hh)||isNaN(mi)) return null;
  const horaDec = hh + mi/60;
  let esNoche, fechaTurno;
  if(horaDec >= 20.5){
    esNoche = true; fechaTurno = new Date(yyyy, mm-1, dd);
  } else if(horaDec < 8){
    esNoche = true; fechaTurno = new Date(yyyy, mm-1, dd-1);
  } else {
    esNoche = false; fechaTurno = new Date(yyyy, mm-1, dd);
  }
  return { esNoche, fechaTurno };
}
function colorNivel(nv){ return nv==="ok"?"var(--verde)":(nv==="crit"?"var(--rojo)":"var(--ambar)"); }

function estadoOT(o){
  if(o.bloqueado) return {clase:"pausada", etiqueta:"PAUSADA"};

  if(o.avance===0) return {clase:"sin-iniciar", etiqueta:"SIN INICIAR"};

}

function grupoDe(r){

// ===== VISTA LISTA: agrupada por día, hora inicio–fin, tarjeta completa sin recortes =====
function renderVistaLista(cont){
  const lst = otsFiltradas();
  const conFecha = lst.filter(o=>o.fechaInicio && o.fechaTermino).sort((a,b)=>a.fechaInicio-b.fechaInicio);
  const sinFecha = lst.filter(o=>!o.fechaInicio || !o.fechaTermino);

  let html = toggleHtml() + buscadorHtml() + filtroHtml() + '<div class="selector">';

  if(conFecha.length){
    const porDia = {}, ordenDias = [];
    conFecha.forEach(o=>{
      const key = o.fechaInicio.toDateString();
      if(!porDia[key]){ porDia[key]=[]; ordenDias.push(key); }
      porDia[key].push(o);
    });
    html += ordenDias.map(key=>{
      const items = porDia[key];
      const d = items[0].fechaInicio;
      const diaTxt = `${DIAS_SEMANA[d.getDay()]} ${String(d.getDate()).padStart(2,"0")}-${String(d.getMonth()+1).padStart(2,"0")}`;
      return `
        <div class="dia-header">${diaTxt}</div>
        ${items.map(o=>{
          const hIni = `${String(o.fechaInicio.getHours()).padStart(2,"0")}:${String(o.fechaInicio.getMinutes()).padStart(2,"0")}`;
          const hFin = `${String(o.fechaTermino.getHours()).padStart(2,"0")}:${String(o.fechaTermino.getMinutes()).padStart(2,"0")}`;
          return `
          <div class="timeline-item">
            <div class="time-badge">${hIni}<span class="hasta">hasta</span>${hFin}</div>
            <div class="timeline-card">${tarjetaOT(o)}</div>
          </div>`;
        }).join("")}
      `;
    }).join("");
  }

  if(sinFecha.length){
    html += `<div class="dia-header sinfecha-header">SIN FECHA EN EL GANTT (${sinFecha.length})</div>`;
    html += sinFecha.map(o=>`<div style="margin-bottom:8px">${tarjetaOT(o)}</div>`).join("");
  }

  if(!lst.length) html += '<div class="empty">No hay resultados. Prueba con otro equipo u OT.</div>';
  html += '</div>';
  cont.innerHTML = html;
}

// ===== VISTA GANTT: compacta, barras cortas con OT+%, detalle completo en tooltip =====
function renderVistaGantt(cont){
  const lst = otsFiltradas();
  const conFecha = lst.filter(o=>o.fechaInicio && o.fechaTermino);
  const sinFecha = lst.filter(o=>!o.fechaInicio || !o.fechaTermino);

  let html = toggleHtml() + buscadorHtml() + filtroHtml() + '<div class="selector">';

  if(conFecha.length){
    const PX_HORA = 10, ALTO_FILA = 82, ANCHO_MIN = 230;
    const minFecha = new Date(Math.min(...conFecha.map(o=>o.fechaInicio)));
    const maxFecha = new Date(Math.max(...conFecha.map(o=>o.fechaTermino)));
    const inicioGrilla = new Date(minFecha.getFullYear(), minFecha.getMonth(), minFecha.getDate());
    const finGrilla = new Date(maxFecha.getFullYear(), maxFecha.getMonth(), maxFecha.getDate()+1);
    const totalDias = Math.round((finGrilla - inicioGrilla) / 86400000);
    const anchoTotal = totalDias * 24 * PX_HORA;

    let headerHtml = '', gridHtml = '';
    for(let d=0; d<totalDias; d++){
      const fecha = new Date(inicioGrilla.getTime() + d*86400000);
      const ancho = 24 * PX_HORA;
      headerHtml += `<div class="gantt-daycol" style="width:${ancho}px">${DIAS_SEMANA[fecha.getDay()]}<span class="fecha">${String(fecha.getDate()).padStart(2,"0")}-${String(fecha.getMonth()+1).padStart(2,"0")}</span></div>`;
      gridHtml += `<div class="gantt-gridline" style="left:${d*ancho}px"></div>`;
    }

    const ordenadas = conFecha.slice().sort((a,b)=>a.fechaInicio-b.fechaInicio);
    let barsHtml = '';
    ordenadas.forEach((o,i)=>{
      const {clase, etiqueta} = estadoOT(o);
      const left = Math.round((o.fechaInicio - inicioGrilla) / 3600000 * PX_HORA);
      const width = Math.max(ANCHO_MIN, Math.round((o.fechaTermino - o.fechaInicio) / 3600000 * PX_HORA));
      const hIni = `${String(o.fechaInicio.getHours()).padStart(2,"0")}:${String(o.fechaInicio.getMinutes()).padStart(2,"0")}`;
      const hFin = `${String(o.fechaTermino.getHours()).padStart(2,"0")}:${String(o.fechaTermino.getMinutes()).padStart(2,"0")}`;
      barsHtml += `
        <a class="gantt-bar ${clase}${esApoyo(o)?' apoyo':''}" href="${hrefOT(o)}"
           title="OT ${o.ot} — ${o.equipo} · ${o.actividad}${o.componente?' · '+o.componente:''} · ${hIni}–${hFin} · ${etiqueta} · ${o.avance}% · ${(o.grupos||[]).map(g=>ETQ_GRUPO[g]).join(' / ')}"
           style="left:${left}px; width:${width}px; top:${i*(ALTO_FILA+6)}px">
          <span class="gb-nombre">OT ${o.ot} — ${o.equipo} · ${(o.grupos||[]).map(g=>ETQ_GRUPO[g]).join(' / ')}${o.alerta?' · ⚠':''}</span>
          <span class="gb-actividad">${o.actividad}${o.componente ? ' · '+o.componente : ''}</span>
          <span class="gb-hora">${hIni}–${hFin} · ${o.avance}%</span>
        </a>`;
    });

    const altoTotal = ordenadas.length * (ALTO_FILA+6);

    html += `
      <div class="gantt-scroll">
        <div class="gantt-inner" style="width:${anchoTotal}px">
          <div class="gantt-header">${headerHtml}</div>
          <div class="gantt-body" style="height:${altoTotal}px">
            ${gridHtml}
            ${barsHtml}
          </div>
        </div>
      </div>
      <div class="gantt-hint">Pasa el mouse sobre una barra para ver el detalle completo</div>`;
  }

  if(sinFecha.length){
    html += `<div class="dia-header sinfecha-header">SIN FECHA EN EL GANTT (${sinFecha.length})</div>`;
    html += sinFecha.map(o=>`<div style="margin-bottom:8px">${tarjetaOT(o)}</div>`).join("");
  }

  if(!lst.length) html += '<div class="empty">No hay resultados. Prueba con otro equipo u OT.</div>';
  html += '</div>';
  cont.innerHTML = html;
}

// ===== Lubricantes: por equipo y componente =====
function claveComp(t){ return normTxt(t).replace(/[^a-z0-9]/g,""); }
function lubCoincide(l, a){
  // Se compara el componente de la actividad con la columna Componente del lubricante;
  // si esa columna no existe o está vacía, con el Punto de lubricación.
  const kl = claveComp(l.comp || l.punto), ka = claveComp(a.componente);
  return !!kl && !!ka && (kl===ka || ka.includes(kl) || kl.includes(ka));
}
function lubRowHtml(l, conComp){
  return `
    <div class="lub-row">
      <div class="lub-punto">${l.punto||"—"}${conComp && l.comp?` · ${l.comp}`:""}${l.equipo?` · ${l.equipo}`:""}</div>
      <div class="lub-main">
        ${l.lub ? `<div class="lub-nombre">${l.marca?`<span class="lub-marca">${l.marca}</span>`:""}${l.lub}</div>`
                : `<div class="lub-pend">Lubricante por definir en terreno</div>`}
        ${l.cant ? `<div class="lub-cant">${l.cant} <small>${l.unidad||""}</small></div>` : (l.lub ? `<div class="lub-pend">Volumen por definir</div>` : "")}
      </div>
      ${l.obs ? `<div class="lub-obs">${l.obs}</div>` : ""}
      ${(l.hds||l.ficha) ? `<div class="lub-docs">${l.hds?`<a href="${l.hds}" target="_blank" rel="noopener">HDS</a>`:""}${l.ficha?`<a href="${l.ficha}" target="_blank" rel="noopener">Ficha técnica</a>`:""}</div>` : ""}
    </div>`;
}
function lubsDeActividad(a, lubs){
  return lubs.filter(l=> claveEq(l.equipo)===claveEq(a.equipo) && lubCoincide(l,a));
}
const claveEq = t => normTxt(t).replace(/[^a-z0-9.]/g,"");

// ===== Etapas (operaciones) de cada actividad: solo se ven en este panel, no afectan al registro =====
function etapasDe(a, ops){
  const nE = normTxt(a.equipo), nA = normTxt(a.actividad);
  return ops.filter(o=> (!o.equipo || normTxt(o.equipo)===nE) && (!o.actividad || normTxt(o.actividad)===nA))
            .sort((x,y)=> x.orden-y.orden || x.fila-y.fila);
}
function estadoEtapa(e){
  if(/paus|bloq/i.test(e.estado)) return {t:"PAUSADA", c:"var(--ambar)", bg:"var(--ambarBg)"};
  if(e.avance>=100 || /complet/i.test(e.estado)) return {t:"COMPLETADA", c:"var(--verde)", bg:"var(--verdeBg)"};
  if(e.avance>0 || /proceso/i.test(e.estado)) return {t:"EN PROCESO", c:"var(--ambar)", bg:"var(--ambarBg)"};
  return {t:"PENDIENTE", c:"var(--muted)", bg:"var(--panel2)"};
}
function etapasHtml(a, ops){
  if(!OPERACIONES_CSV_URL) return "";
  const et = etapasDe(a, ops);
  if(!et.length) return '<div class="et-vacio">Sin etapas definidas para esta actividad.</div>';
  const hechas = et.filter(e=>estadoEtapa(e).t==="COMPLETADA").length;
  const pct = Math.round(et.reduce((s,e)=>s+e.avance,0)/et.length);
  return `<div class="etapas">
    <div class="et-head"><span>Etapas · ${hechas} de ${et.length} completadas</span><span>${pct}%</span></div>
    ${et.map((e,i)=>{ const st = estadoEtapa(e); return `
      <div class="et-row">
        <span class="et-n" style="${st.t==='COMPLETADA'?'background:var(--verde);color:#0B1220':''}">${i+1}</span>
        <div class="et-main">
          <div class="et-top"><span class="et-nombre">${e.op}</span>
            <span class="et-pill" style="background:${st.bg};color:${st.c}">${st.t}</span>
            <span class="et-pct">${e.avance}%</span></div>
          <div class="bar"><div class="bar-fill" style="width:${e.avance}%;background:${st.c==='var(--muted)'?'var(--dim)':st.c}"></div></div>
          ${e.obs ? `<div class="et-obs">${e.obs}</div>` : ""}
        </div>
      </div>`; }).join("")}
  </div>`;
}

  lubs = (lubs||[]).filter(l=>l.ot===OT_SELECCIONADA && (!EQUIPO_SELECCIONADO || !l.equipo || claveEq(l.equipo)===claveEq(EQUIPO_SELECCIONADO)));

          <div class="metric"><div class="v" style="color:var(--verde)">${enTerreno.length}</div><div class="l">En terreno ahora</div></div>
          <div class="metric"><div class="v">${unicas}</div><div class="l">Personas distintas</div></div>
          <div class="metric"><div class="v">${personasOT.length}</div><div class="l">Entradas totales</div></div>
          <div class="metric"><div class="v">${promDur}</div><div class="l">Duración promedio</div></div>
        </div>

        ${lubs.length===0 ? `<div class="lub-box"><div class="section-title">Lubricantes y volúmenes</div><div class="empty" style="padding:14px">Sin información de lubricante para esta OT.</div></div>` :
          (lubsSueltas.length ? `<div class="lub-box"><div class="section-title">Lubricantes y volúmenes</div>${lubsSueltas.map(l=>lubRowHtml(l,true)).join("")}</div>` :
            `<div class="lub-box"><div class="section-title">Lubricantes y volúmenes</div><div class="empty" style="padding:14px">Los lubricantes están dentro de cada actividad.</div></div>`)}
      </div>

      <div class="col">
        <div class="section-title">Desglose de actividades</div>
        <div class="col-scroll">
        ${actividades.map(a=>{
          const n = nivel(a.avance);
          const c = colorNivel(n);
          const pillBg = a.bloqueado ? "var(--ambarBg)" : (n==="ok"?"var(--verdeBg)":(n==="crit"?"var(--rojoBg)":"var(--ambarBg)"));
          const pillTxt = a.bloqueado ? "BLOQUEADA" : a.estado.toUpperCase();
          return `
          <div class="act-card">
            <div class="act-top">
              <div>
                <span class="act-name">${a.actividad}</span>${badgeResp(a.respons)}${a.alerta?'<span class="alerta-badge">⚠ Obs. planificación</span>':''}
                <span class="act-pill" style="background:${pillBg};color:${c}">${pillTxt}</span>
              </div>
              <span class="act-pct" style="color:${c}">${a.avance}%</span>
            </div>
            ${(a.componente || a.resp || variosEq) ? `<div class="act-resp">${[variosEq ? a.equipo : "", a.componente, a.resp].filter(Boolean).join(" · ")}</div>` : ""}
            <div class="bar" style="margin-top:6px"><div class="bar-fill fill-${n}" style="width:${a.avance}%"></div></div>
            ${a.bloqueado ? `<div style="margin-top:6px;font-size:11px;color:var(--ambar)">⚠ ${a.bloqueado}</div>` : ""}
            ${(()=>{ const ll = lubsDeActividad(a, lubs); return ll.length ? `<div class="lub-en-act"><div class="et-head" style="margin-bottom:6px"><span>Lubricante · ${a.equipo}${a.componente?' · '+a.componente:''}</span></div>${ll.map(l=>lubRowHtml(l,false)).join("")}</div>` : ""; })()}
            ${etapasHtml(a, ops)}
            ${(a.obs||a.alcance) ? `<div class="act-obs">${a.obs?`<div><b>Observación:</b> ${a.obs}</div>`:""}${a.alcance?`<div><b>Alcance Bel-Ray:</b> ${a.alcance}</div>`:""}</div>` : ""}
          </div>`;
        }).join("")}
        </div>
      </div>

      <div class="col">
        <div class="section-title">Personas en el punto</div>
        <div class="col-scroll">
        ${personasOT.length===0 ? '<div class="empty">Nadie ha registrado entrada en esta OT todavía.</div>' :
          (function(){
            // agrupa por (fecha de turno + día/noche)
            const grupos = {}, ordenGrupos = [];
            personasOT.forEach(p=>{
              const clas = clasificarTurno(p.fecha, p.hEnt);
              const key = clas ? clas.fechaTurno.toDateString()+(clas.esNoche?'N':'D') : 'sin-fecha';
              if(!grupos[key]){ grupos[key] = { clas, items: [] }; ordenGrupos.push(key); }
              grupos[key].items.push(p);
            });
            // ordena grupos: más reciente primero (por fecha de turno, noche después del día del mismo día)
            ordenGrupos.sort((ka,kb)=>{
              const ga=grupos[ka].clas, gb=grupos[kb].clas;
              if(!ga && !gb) return 0;
              if(!ga) return 1;
              if(!gb) return -1;
              const ta = ga.fechaTurno.getTime() + (ga.esNoche?0.5:0);
              const tb = gb.fechaTurno.getTime() + (gb.esNoche?0.5:0);
              return tb-ta;
            });
            return ordenGrupos.map(key=>{
              const g = grupos[key];
              let encabezado;
              if(g.clas){
                const d = g.clas.fechaTurno;
                const diaTxt = `${DIAS_SEMANA[d.getDay()]} ${String(d.getDate()).padStart(2,"0")}-${String(d.getMonth()+1).padStart(2,"0")}`;
                const icono = g.clas.esNoche ? "🌙" : "☀️";
                const turnoTxt = g.clas.esNoche ? "Turno Noche" : "Turno Día";
                encabezado = `${icono} ${diaTxt} · ${turnoTxt}`;
              } else {
                encabezado = "Sin fecha registrada";
              }
              const filas = g.items.map(p=>`
                <div class="persona-row ${p.estado==='en terreno'?'activo':''}">
                  <div class="p-head">
                    <span class="p-dot ${p.estado==='en terreno'?'on':'off'}"></span>
                    <span class="p-nombre" onclick='abrirModalPersona(${JSON.stringify(p.persona)})'>${p.persona}</span>
                    ${p.equipo ? `<span class="p-dur" style="margin-left:auto;margin-right:8px">${p.equipo}</span>` : ""}
                    ${p.dur ? `<span class="p-dur">${p.dur}</span>` : ""}
                  </div>
                  <span class="p-horas">
                    <span class="h-in">▼ ${p.hEnt||'—'}</span>
                    <span class="h-out">${p.hSal ? '▲ '+p.hSal : (p.estado==='en terreno'?'En terreno':'—')}</span>
                  </span>
                </div>`).join("");
              return `<div class="turno-header">${encabezado}</div>${filas}`;
            }).join("");
          })()}
        </div>
      </div>
    </div>
  `;
}

let huboRenderExitoso = false;

async function cargarTodo(){
  try{
    const [captura, nfc, certs, lubs, ops] = await Promise.all([cargarCaptura(), cargarNFC(), cargarCerts(), cargarLubricantes(), cargarOperaciones()]);
    certsData = certs;

    if(!OT_SELECCIONADA){
      const vistas={}, otsUnicas=[];
      captura.forEach(a=>{
        if(!a.ot || a.ot==="-" || /^sin\s*ot$/i.test(a.ot)) return;   // actividades sin OT no tienen panel propio
        const kv = a.ot + "|" + normTxt(a.equipo);   // una entrada por OT + equipo
        if(!vistas[kv]){
          const g = GANTT_FECHAS[a.ot];
          vistas[kv] = { ot:a.ot, equipo:a.equipo, actividad:a.actividad, componente:a.componente,
                            fechaInicio: g ? parseFechaHoraCL(g[0]) : null,
                            fechaTermino: g ? parseFechaHoraCL(g[1]) : null,
                            hrsTotal:0, hrsGanadas:0, sumAv:0, nAct:0, txt:"", bloqueado:"", respons:a.respons, grupos:[], alerta:false };
          otsUnicas.push(vistas[kv]);
        }
        const g = vistas[kv];
        g.hrsTotal += a.hrs;
        g.hrsGanadas += a.hrs * a.avance / 100;
        g.sumAv += a.avance; g.nAct++;
        g.txt += " " + [a.equipo, a.actividad, a.componente].join(" ");
        if(a.bloqueado && !g.bloqueado) g.bloqueado = a.bloqueado;
        if(a.alerta) g.alerta = true;
        { const gg = grupoDe(a.respons); if(!g.grupos.includes(gg)) g.grupos.push(gg); }
      });
      otsUnicas.forEach(o=>{ o.avance = o.hrsTotal>0 ? Math.round(o.hrsGanadas/o.hrsTotal*100) : (o.nAct ? Math.round(o.sumAv/o.nAct) : 0); });
      renderSelector(otsUnicas);
      huboRenderExitoso = true;
      actualizarFooter("selector de OT");
      return;
    }

    const actividades = captura.filter(a=>a.ot===OT_SELECCIONADA && (!EQUIPO_SELECCIONADO || normTxt(a.equipo)===normTxt(EQUIPO_SELECCIONADO)));
    if(!actividades.length){
      document.getElementById("tituloOT").textContent = "OT " + OT_SELECCIONADA;
      document.getElementById("contenido").innerHTML = '<div class="empty">No se encontraron actividades para esta OT en CAPTURA.</div>';
      actualizarFooter("sin datos para esta OT");
      return;
    }
    render(actividades, nfc, lubs, ops);
    huboRenderExitoso = true;
    actualizarFooter("en vivo");
  }catch(e){
    // Si ya había un render bueno en pantalla, NO lo borramos por un fallo
    // transitorio de red — solo avisamos en el pie y reintentamos en 20s.
    if(!huboRenderExitoso){
      document.getElementById("contenido").innerHTML = '<div class="empty">Error de conexión. Reintentando…</div>';
    }
    actualizarFooter("error de conexión (manteniendo última data)");
  }
}

function actualizarFooter(fuente){
  const ahora = new Date().toLocaleTimeString("es-CL",{timeZone:"America/Santiago"});
  document.getElementById("footer").textContent = `Última actualización: ${ahora} · Fuente: ${fuente} · Se refresca cada 20 segundos`;
}
function tick(){
  document.getElementById("clock").textContent = new Date().toLocaleTimeString("es-CL",{timeZone:"America/Santiago"});
}

// Botón volver: desde una OT regresa a la lista de OT; desde la lista, al panel general
(function(){
  const b = document.getElementById("btnVolver"); if(!b) return;
  if(OT_SELECCIONADA){ b.href = "Panel_OT.html"; b.textContent = "← Volver a la lista de OT"; }
  else { b.href = "index.html"; b.textContent = "← Volver al panel general"; }
})();
tick(); setInterval(tick,1000);
cargarTodo(); setInterval(cargarTodo, REFRESH_MS);
</script>
